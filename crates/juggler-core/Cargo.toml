[package]
name = "juggler-core"
description = "Domain model, storage, and usage accounting for AI Juggler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
zeroize = { workspace = true }
rusqlite = { workspace = true, features = ["bundled", "backup"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# AJ-E1009: the backup archive (gzip tar, sha256 per entry) is read here,
# below the app, so the fuzz target needs nothing of the app (AJ-E2008).
flate2 = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
# AJ-E2019 (ADR-0029): the few domain types a command returns as they are
# get their TypeScript from ts-rs too, only in the app's build (`ts`).
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }

[features]
# The app turns it on: domain types a command serves export their TypeScript.
ts = ["dep:ts-rs"]

[dev-dependencies]
proptest = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
tempfile = { workspace = true }
