[package]
name = "juggler-app"
description = "Tauri application shell: commands, events, updater wiring, and the desktop entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["stats"]
# Usage statistics (D-19). Without it the crate is not in the binary and
# Settings shows "not included in this build".
stats = ["dep:juggler-stats", "dep:thread-priority"]

[lints]
workspace = true

[dependencies]
base64 = "0.23"
dirs = "7.0.0"
flate2 = "1.1"
juggler-adapter = { version = "0.0.1", path = "../juggler-adapter" }
juggler-account = { version = "0.0.1", path = "../juggler-account" }
juggler-adapters = { version = "0.0.1", path = "../juggler-adapters" }
juggler-core = { version = "0.0.1", path = "../juggler-core" }
juggler-handover = { version = "0.0.1", path = "../juggler-handover" }
juggler-link = { version = "0.0.1", path = "../juggler-link" }
# AJ-E1102: opt-in usage statistics; leave it out with --no-default-features.
juggler-stats = { version = "0.0.1", path = "../juggler-stats", optional = true }
# AJ-E1108: the usage-stats tick (and any puzzle it solves) runs at low priority.
thread-priority = { version = "3.1.1", optional = true }
juggler-supervisor = { version = "0.0.1", path = "../juggler-supervisor" }
getrandom = "0.4"
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tar = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# AJ-E1010: without the plugin's default `zip` feature. That feature only
# adds Windows installer extraction, through a `zip` version with open
# advisories; macOS updates use tar + gzip, which the plugin always
# includes there. Re-enable it when Windows releases start and the
# plugin ships a fixed `zip` (docs/RELEASING.md).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
zstd = "0.14"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dev-dependencies]
# The usage-stats integration tests seed the store directly.
juggler-stats = { version = "0.0.1", path = "../juggler-stats" }
# Timing budgets measured as thread CPU time (AJ-E806 ledger).
cpu-time = "1"
juggler-handover = { version = "0.0.1", path = "../juggler-handover" }
tempfile = "3.27.0"

[target.'cfg(target_os = "macos")'.dependencies]
# AJ-E415: ScreenCaptureKit mirror — macOS-only; the preview driver
# (state machine, pause/teardown) is platform-independent and tested
# everywhere against a scripted capture source.
screencapturekit = { version = "11.0.0", features = ["macos_14_0"] }
# D-17: the audited init shim (one unsafe call, isolated crate).
juggler-scap-init = { version = "0.0.1", path = "../juggler-scap-init" }
# D-25: the first-run OS access step — safe wrappers (their FFI stays in
# their own crates; ours keep `unsafe_code = "forbid"`): Screen Recording
# preflight/request, and the Accessibility check with the system prompt
# that adds AI Juggler to the list.
core-graphics = "0.25.0"
macos-accessibility-client = "0.0.2"
