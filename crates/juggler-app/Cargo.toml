[package]
name = "juggler-app"
description = "Tauri application shell: commands, events, updater wiring, and the desktop entry point."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["stats"]
# Usage statistics (D-19). Without it the crate is not in the binary and
# Settings shows "not included in this build".
stats = ["dep:juggler-stats", "dep:thread-priority"]
# The read-only test bridge (docs/qa/DEV-BRIDGE.md): the real UI in a
# browser against this backend, for QA on real data without granting the
# app Accessibility. Off by default, debug builds only — a release build
# with it doesn't compile — and it runs only when AIJ_DEV_BRIDGE=1.
# Every crate it uses is already in the tree (hyper serves the Fleet link).
dev-bridge = [
    "dep:bytes",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:subtle",
    "dep:zeroize",
]

[lints]
workspace = true

[dependencies]
# D-26: open at login (a safe stub off macOS).
juggler-login-item = { version = "0.1.0", path = "../juggler-login-item" }
base64 = "0.23"
dirs = "7.0.0"
flate2 = "1.1"
# D-38: apps' icons are kept as PNGs (already in the tree through tauri).
png = "0.18"
juggler-adapter = { version = "0.1.0", path = "../juggler-adapter" }
juggler-account = { version = "0.1.0", path = "../juggler-account" }
juggler-adapters = { version = "0.1.0", path = "../juggler-adapters" }
juggler-core = { version = "0.1.0", path = "../juggler-core" }
juggler-handover = { version = "0.1.0", path = "../juggler-handover" }
juggler-link = { version = "0.1.0", path = "../juggler-link" }
# AJ-E1102: opt-in usage statistics; leave it out with --no-default-features.
juggler-stats = { version = "0.1.0", path = "../juggler-stats", optional = true }
# AJ-E1108: the usage-stats tick (and any puzzle it solves) runs at low priority.
thread-priority = { version = "3.1.1", optional = true }
juggler-supervisor = { version = "0.1.0", path = "../juggler-supervisor" }
getrandom = "0.4"
prost = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
tar = "0.4"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tauri = { version = "2.12.3", features = [] }
tauri-plugin-dialog = "2"
# AJ-E1010: the launch alert when an older AI Juggler meets newer data
# (before any window exists), on every desktop platform. Already in the
# tree via tauri-plugin-dialog, with the same features (gtk3 on Linux,
# common controls on Windows).
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6", "gtk3"] }
tauri-plugin-global-shortcut = "2"
# AJ-E1510: system notifications. 2.6 is the first that reports a click
# on macOS (a notification's tap reaches `on_action`).
tauri-plugin-notification = "2.6"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
# AJ-E1010: without the plugin's default `zip` feature. That feature only
# adds Windows installer extraction, through a `zip` version with open
# advisories; macOS updates use tar + gzip, which the plugin always
# includes there. Re-enable it when Windows releases start and the
# plugin ships a fixed `zip` (docs/RELEASING.md).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
zstd = "0.14"
# dev-bridge only (see the feature).
bytes = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", default-features = false, features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
subtle = { version = "2.6", optional = true }
zeroize = { version = "1.8", optional = true }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dev-dependencies]
# The usage-stats integration tests seed the store directly.
juggler-stats = { version = "0.1.0", path = "../juggler-stats" }
# Timing budgets measured as thread CPU time (AJ-E806 ledger).
cpu-time = "1"
juggler-handover = { version = "0.1.0", path = "../juggler-handover" }
tempfile = "3.27.0"
# AJ-E1542: reads the Codex config a set-up wrote.
toml = "1"
# AJ-E1010: the real updater plugin against a local feed — a mock Tauri
# app, and minisign signatures made in the test (signature fixtures).
tauri = { version = "2.12.3", features = ["test"] }
ed25519-dalek = "3"
# AJ-E1010: databases at an earlier schema, built and read as an older
# build would (the going-back fixtures).
rusqlite = "0.40.2"

[target.'cfg(target_os = "macos")'.dependencies]
# AJ-E415: ScreenCaptureKit mirror — macOS-only; the preview driver
# (state machine, pause/teardown) is platform-independent and tested
# everywhere against a scripted capture source.
screencapturekit = { version = "11.0.0", features = ["macos_14_0"] }
# D-17: the audited init shim (one unsafe call, isolated crate).
juggler-scap-init = { version = "0.1.0", path = "../juggler-scap-init" }
# D-25: the first-run OS access step — safe wrappers (their FFI stays in
# their own crates; ours keep `unsafe_code = "forbid"`): Screen Recording
# preflight/request, and the Accessibility check with the system prompt
# that adds AI Juggler to the list.
core-graphics = "0.25.0"
macos-accessibility-client = "0.0.2"
# AJ-E1501: a removed copy's folder goes to the Trash (NSFileManager
# trashItem — never deleted, never Finder scripting).
trash = { version = "5.2.9", default-features = false }
# The launch alerts (QA batch 9): an NSAlert in AI Juggler's own process,
# so one can never outlive it (rfd's alert without a window is the
# system's, and stayed up after the app was gone). Safe calls only, with
# a MainThreadMarker; already in the tree through rfd and tao.
# AJ-E2102: `libc` adds NSRunningApplication's lookup by pid (Go to it
# brings one app instance forward by its process, never by bundle id).
# 0.1.5: `NSWorkspace` reads the frontmost app, so Go to it says it
# brought an app forward only once it really is in front.
objc2 = "0.6"
# D-38: an app's icon from its bundle (`NSWorkspace::iconForFile`),
# rendered to a bitmap and read back pixel by pixel: safe calls only
# (src/features/app_icons/render.rs says why each).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData", "NSGeometry", "NSBundle", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSRunningApplication", "NSView", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSColor", "NSColorSpace"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# 0.1.5: the activation live check runs the main thread's loop while it
# waits, so macOS can tell it which app is in front.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSRunLoop", "NSDate"] }

# 0.1.5: the activation live check. AppKit wants the main thread, which the
# test harness keeps for itself, so this test has its own `main`; it runs
# only with `-- --ignored` (see the file).
[[test]]
name = "activation_real"
harness = false
