[package]
name = "juggler-supervisor"
description = "Process supervision and resource management: PTY spawn, lifecycle, health, machine stewardship."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
tracing = { workspace = true }
juggler-adapter = { version = "0.4.0", path = "../juggler-adapter" }
juggler-core = { version = "0.4.0", path = "../juggler-core" }
portable-pty = "0.9.0"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sysinfo = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# This thread's CPU time for the hot path's budget (as juggler-app's tests).
cpu-time = { workspace = true }
juggler-adapters = { version = "0.4.0", path = "../juggler-adapters" }
tempfile = { workspace = true }

[target."cfg(unix)".dependencies]
nix = { workspace = true, features = ["signal", "process"] }
# AJ-E505: the listener table via the low-level OS APIs (libproc /
# netlink) — lsof/netstat shell-outs are banned (pass2 §7).
netstat2 = "0.11"

# AJ-E1401: machine signals the OS reports outside `sysinfo` — the kernel's
# memory-pressure level (sysctl), power and thermal state (safe IOKit and
# Foundation bindings; no `unsafe` in this crate).
[target."cfg(target_os = \"macos\")".dependencies]
sysctl = "0.6"
# D-27: the pages the memory compressor occupies (the audited shim).
juggler-vm-stats = { version = "0.4.0", path = "../juggler-vm-stats" }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "block2"] }
# AJ-E1509: the block an activity is held in (`awake.rs`).
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-io-kit = { version = "0.3.2", default-features = false, features = ["std", "ps"] }
