[package]
name = "juggler-floor"
description = "The Floor's model (ADR-0026): the office layout, style families and kits, signals and the scene, as pure Rust with no GPU and no platform code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The GPU-ready vertex and instance layouts (plain old data; no unsafe here).
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"

[lints]
workspace = true
