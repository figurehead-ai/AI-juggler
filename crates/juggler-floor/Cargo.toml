[package]
name = "juggler-floor"
description = "The Floor's model (ADR-0026): the office layout, style families and kits, signals and the scene, as pure Rust with no GPU and no platform code."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The GPU-ready vertex and instance layouts (plain old data; no unsafe here).
bytemuck = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
ts-rs = { workspace = true, features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
