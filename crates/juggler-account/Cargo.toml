[package]
name = "juggler-account"
description = "The optional Figurehead account client: linking, Keychain-held device token, entitlements."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chacha20poly1305 = "0.11"
getrandom = "0.4"
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustls-native-certs = "0.8"
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
