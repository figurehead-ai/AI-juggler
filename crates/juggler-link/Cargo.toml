[package]
name = "juggler-link"
description = "Fleet link: mDNS discovery, pairing, and gRPC-over-mTLS telemetry/control between instances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
ed25519-dalek = "3"
getrandom = "0.4"
hmac = "0.13"
hyper-util = "0.1"
juggler-core = { version = "0.0.1", path = "../juggler-core" }
mdns-sd = "0.21"
prost = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
spake2 = "0.4"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
x509-parser = "0.18"

[dev-dependencies]
# Load budgets measured as this thread's CPU time, as juggler-app's tests do.
cpu-time = "1"
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"
