[package]
name = "juggler-link"
description = "Fleet link: mDNS discovery, pairing, and gRPC-over-mTLS telemetry/control between instances."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = { workspace = true }
hmac = "0.13"
hyper-util = { workspace = true }
mdns-sd = "0.21"
prost = { workspace = true }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
spake2 = "0.4"
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.14"
tonic-prost = "0.14"
tower = "0.5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
x509-parser = "0.18"

[dev-dependencies]
# Load budgets measured as this thread's CPU time, as juggler-app's tests do.
cpu-time = { workspace = true }
protox = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[build-dependencies]
protox = "0.10"
tonic-prost-build = "0.14"

# AJ-E2011 R7: cargo-machete finds unused dependencies by searching the
# sources; tonic-prost is used by the code `tonic::include_proto!` generates.
[package.metadata.cargo-machete]
ignored = ["tonic-prost"]
