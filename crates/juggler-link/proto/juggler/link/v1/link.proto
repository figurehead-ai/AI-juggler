// AI Juggler Fleet link — protocol v1 (ADR-0013 architecture contract).
//
// Rules for changing this file (enforced by the descriptor snapshot
// test in `tests/proto_contract.rs`):
//   * never renumber or remove a field — reserve it instead;
//   * new fields are optional by construction (proto3);
//   * once released, a new command or message bumps PROTOCOL_MINOR in
//     `src/protocol.rs` (v1.0 is unreleased; additions before the first
//     release ship as part of v1.0);
//   * nothing here may carry vendor credentials, keychain material,
//     the identity private key, account tokens, or transcript text
//     (the one exception is the handover pack fetch, AJ-E706).
syntax = "proto3";

package juggler.link.v1;

service Link {
  // Version negotiation and identity assertion. The first call on
  // every connection; nothing else is served until it succeeds.
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Liveness + clock-offset measurement (every 2 s).
  rpc Heartbeat(Ping) returns (Pong);
  // Core telemetry: heartbeats, machine resources, session deltas.
  rpc Telemetry(TelemetryRequest) returns (stream TelemetryDelta);
  // The ordered control-command stream (one per connection).
  rpc Command(stream ControlCommand) returns (stream CommandResult);
  // Pairing (AJ-E704): the ONLY call an unpinned key may make. SPAKE2
  // over the host's 6-digit code, key confirmation bound to this TLS
  // session, then both users confirm before either side pins.
  rpc Pair(stream PairMessage) returns (stream PairMessage);
  // AJ-E706: the machine holding the work pushes it — only after its own
  // user clicked Switch (ADR-0013's single transcript-bearing exception).
  // First part: a ControlCommand (TakeHandover or SwitchBack) with every
  // command check; then the bundle in chunks; then its sha256. The node
  // re-checks everything and decides; progress streams back.
  rpc Handover(stream HandoverPart) returns (stream HandoverProgress);
}

message PairMessage {
  oneof step {
    PairStart start = 1;
    PairChallenge challenge = 2;
    PairConfirm confirm = 3;
    PairDecision decision = 4;
    PairFailure failure = 5;
  }
}

// Joiner → host.
message PairStart {
  string machine_id = 1;
  string label = 2;
  bytes spake_message = 3;
  ProtocolVersion version = 4;
  // The port the joiner's own node listens on (0 = not listening), so
  // the host can reach it later at the address it connected from.
  uint32 listen_port = 5;
}

// Host → joiner.
message PairChallenge {
  string machine_id = 1;
  string label = 2;
  bytes spake_message = 3;
}

// Both directions: HMAC over the transcript (role-separated).
message PairConfirm {
  bytes mac = 1;
}

// Both directions, after each user's own Confirm / Cancel.
message PairDecision {
  bool commit = 1;
}

// Host → joiner: why pairing stopped (plain words + a stable code).
message PairFailure {
  string reason_code = 1;
  string message = 2;
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message HelloRequest {
  ProtocolVersion version = 1;
  // The caller's MachineId; must equal the registry entry for the
  // TLS-authenticated key.
  string machine_id = 2;
  // Caller's clock, epoch ms (display + offset seed only).
  int64 sent_at_ms = 3;
}

message HelloResponse {
  ProtocolVersion version = 1;
  string machine_id = 2;
  // "full" | "degraded" — what this node will serve this peer.
  string service_level = 3;
  // Why degraded (plain words), when it is.
  string degraded_reason = 4;
  // What the node grants the caller: "no_access" | "view" | "control".
  string permission = 5;
  int64 sent_at_ms = 6;
  // AJ-E708: this node's sync epoch — a random id for its outbox; a new
  // epoch (reset or reinstalled machine) tells consoles to start afresh.
  string sync_epoch = 7;
}

message Ping {
  int64 sent_at_ms = 1;
}

message Pong {
  int64 ping_sent_at_ms = 1;
  int64 node_time_ms = 2;
}

message TelemetryRequest {
  // Per-node sequence the caller already has (0 = from the start).
  uint64 since_sequence = 1;
}

message TelemetryDelta {
  // Origin MachineId — always the serving node in v1 (no relaying).
  string origin_machine_id = 1;
  // The origin's outbox sequence for durable record changes (AJ-E708);
  // 0 = an unsequenced live value (resources, live numbers, alerts).
  uint64 sequence = 2;
  // Hybrid logical clock: physical ms + logical counter.
  int64 hlc_ms = 3;
  uint32 hlc_counter = 4;
  oneof payload {
    MachineResources resources = 10;
    SessionDelta session = 11;
    AlertDelta alert = 12;
    CleanupDelta cleanup = 13;
    CatalogDelta catalog = 14;
  }
}

// AJ-E706: what this node can take work into — its Launch settings, the
// harness versions installed here and the projects it knows. Never a
// path: a project root travels only as a digest a console compares with
// the digest of its own root (same digest = same checkout path).
message CatalogDelta {
  repeated CatalogRecipe recipes = 1;
  repeated HarnessVersion harnesses = 2;
  repeated CatalogProject projects = 3;
}

message CatalogRecipe {
  string recipe_id = 1;
  string name = 2;
  string provider_id = 3;
  string account_label = 4;
}

message HarnessVersion {
  string provider_id = 1;
  // As the harness reports it; empty = not installed on this node.
  string version = 2;
}

message CatalogProject {
  string project_id = 1;
  // The folder's name (never a path).
  string name = 2;
  // Hex sha256 of "aij-project-root-v1\0" + the canonical root.
  string root_digest = 3;
}

// AJ-E707: this node's managed processes (its Cleanup Centre, read-only
// shape). Never a command line — only the executable's name.
message CleanupDelta {
  repeated CleanupProcess processes = 1;
  bool ledger_degraded = 2;
}

message CleanupProcess {
  string instance_id = 1;
  uint32 pid = 2;
  // "root" | "helper"
  string role = 3;
  // "running" | "orphaned" | "unverifiable" | …
  string state = 4;
  string state_label = 5;
  // The node's own identity check passed (pid + start time + exe + boot).
  bool verified = 6;
  // The executable's file name only.
  string name = 7;
  optional int64 age_ms = 8;
  optional uint64 rss_bytes = 9;
  optional double cpu_percent = 10;
  string ports = 11;
  string provider = 12;
  string account_label = 13;
}

// AJ-E709: an alert this node's own alert engine emitted, routed to its
// paired consoles (the text is the same plain words the node shows).
message AlertDelta {
  // "tray-amber" | "actionable" | "exhausted" | "reset-reached" | "digest"
  string kind = 1;
  string account_label = 2;
  string text = 3;
  int64 at_ms = 4;
}

message MachineResources {
  double cpu_percent = 1;
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
}

message SessionDelta {
  string instance_id = 1;
  string provider_id = 2;
  string account_label = 3;
  // The Instance status word ("running", "waiting_user", …).
  string status = 4;
  int64 updated_at_ms = 5;
  // AJ-E705 additions — unset means the node doesn't know (the console
  // shows "Unavailable", never a guess).
  // The display model, and how it is known ("launch" | "in-session" |
  // "transcript" | "unknown").
  optional string model = 6;
  string model_source = 7;
  // The project folder's NAME only — never a path.
  optional string project_name = 8;
  int64 started_at_ms = 9;
  optional int64 last_activity_ms = 10;
  // Live process numbers for the Instance's tree, when sampled.
  optional double cpu_percent = 11;
  optional uint64 rss_bytes = 12;
  optional uint32 process_count = 13;
  // "terminal" | "desktop" (which Instances have a window to focus).
  string kind = 14;
}

message ControlCommand {
  // The console's MachineId; must equal the TLS peer.
  string console_machine_id = 1;
  // 128-bit random nonce.
  bytes nonce = 2;
  // Per-console monotonic sequence.
  uint64 sequence = 3;
  // Console clock at issue, epoch ms; the node converts with the
  // measured offset and enforces a 30 s expiry on its own clock.
  int64 issued_at_ms = 4;
  // Commands reference only records that exist on the node — never a
  // binary, arguments, environment, or an arbitrary working directory.
  oneof action {
    StopInstance stop_instance = 10;
    LaunchRecipe launch_recipe = 11;
    // AJ-E711: bring a desktop Instance's window forward ON THE NODE
    // (the node runs its own tiered focus; nothing is injected remotely).
    FocusInstance focus_instance = 12;
    // AJ-E707: clean one process the node owns (it re-verifies first and
    // runs its own TERM → grace → KILL ladder).
    CleanProcess clean_process = 13;
    // AJ-E706: only valid as the first part of a Handover call.
    TakeHandover take_handover = 14;
    SwitchBack switch_back = 15;
  }
}

// Take work from the console: run it under a Launch setting that exists
// here, in a project this node knows. Ids are the console's lineage ids,
// so both machines record the same Switch Graph edge.
message TakeHandover {
  string recipe_id = 1;
  // The project on THIS node (same path, or the user's confirmed mapping).
  string project_id = 2;
  // "transplant" (T2: the native session set) | "replay" (T3: turns).
  string mechanism = 3;
  uint64 bundle_bytes = 4;
  string work_id = 5;
  string from_epoch_id = 6;
  string edge_id = 7;
  string to_epoch_id = 8;
  string from_provider_id = 9;
  string from_account_label = 10;
  string from_native_id = 11;
  // The F-label shown to the user when they clicked.
  string fidelity_shown = 12;
}

// Resume the original native session on this node with one summarised
// delta turn (D-05: never a copy-back over the original).
message SwitchBack {
  // The original epoch on THIS node.
  string original_epoch_id = 1;
  // The console's away epoch (mirrored here for lineage).
  string from_epoch_id = 2;
  string edge_id = 3;
  string new_epoch_id = 4;
  string work_id = 5;
  uint64 bundle_bytes = 6;
  // "" = refuse if the original diverged; "keep_mine" = resume the
  // original anyway (its newer turns stay, the delta follows them);
  // "keep_both" = fork the original and resume the fork.
  string divergence_choice = 7;
  string from_provider_id = 8;
  string from_account_label = 9;
}

message HandoverPart {
  oneof part {
    ControlCommand command = 1;
    bytes chunk = 2;
    HandoverEnd end = 3;
  }
}

message HandoverEnd {
  // Hex sha256 of every chunk in order.
  string sha256 = 1;
}

// What a Handover's chunks decode to (after the sha256 matches).
message HandoverBundle {
  string provider_id = 1;
  string native_id = 2;
  string harness_version = 3;
  // T2: the native session set (flat file names).
  repeated BundleFile files = 4;
  // T3: the distilled turns to prime a fresh session with.
  repeated ReplayTurn turns = 5;
  // SwitchBack: the one summarised "while you were away" turn.
  string delta_turn = 6;
}

message BundleFile {
  string name = 1;
  bytes content = 2;
}

message ReplayTurn {
  string role = 1;
  string text = 2;
}

message HandoverProgress {
  uint64 received_bytes = 1;
  // "receiving" | "installing" | "launching" | "done" | "rejected"
  string phase = 2;
  // Set on "done" and "rejected".
  CommandResult result = 3;
  // The new Instance on this node, on "done".
  string instance_id = 4;
  // Set when a SwitchBack was refused as diverged (AJ-E708 Req.5).
  Divergence divergence = 5;
}

// What changed on this node since the work left — the conflict sheet's
// preview. Counts and times only, never content.
message Divergence {
  uint32 turns_since = 1;
  int64 last_activity_ms = 2;
  string summary = 3;
}

message CleanProcess {
  string instance_id = 1;
  uint32 pid = 2;
}

message FocusInstance {
  string instance_id = 1;
}

message StopInstance {
  string instance_id = 1;
}

message LaunchRecipe {
  // A Launch-settings id that exists on the node.
  string recipe_id = 1;
  // A project root the node already knows (empty = the recipe default).
  string project_id = 2;
}

message CommandResult {
  uint64 sequence = 1;
  // "accepted" | "rejected"
  string outcome = 2;
  // Stable machine code when rejected ("replayed", "expired",
  // "permission_denied", "unknown_record", …).
  string reason_code = 3;
  // Plain words for the console UI.
  string message = 4;
}
