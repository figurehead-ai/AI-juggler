[package]
name = "juggler-platform"
description = "The operating-system seams: who this process runs as, owner-only files and folders, local connections, and whether a program is safe to run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The workspace lint baseline applies (`unsafe_code = "forbid"`): every
# seam here is built on safe bindings. Where a platform needs `unsafe`
# (a Windows named pipe's client identity, an owner-only ACL), that
# platform says "not available on this system yet" until a vetted
# wrapper crate or an audited carve-out is decided.
[lints]
workspace = true

[dependencies]
# AsyncRead / AsyncWrite for the local connection's stream; the Unix
# listener itself needs `net`.
tokio = { version = "1.53.3", default-features = false, features = ["net"] }
# This computer's memory, for the local cache's size (ADR-0023).
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

# 0.3.5: an "open this link" event to one process (`apps::send_link`),
# through Foundation's safe bindings (no `unsafe` here).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSString", "NSDate", "NSError", "objc2-core-services", "libc", "NSDateFormatter", "NSFormatter", "NSCalendar", "NSLocale"] }
# 0.3.8: whether an app process is one this login session's window server
# knows (`apps::detached`): `NSRunningApplication` by pid, a safe call
# (already in the tree through juggler-app).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSRunningApplication"] }

[target."cfg(unix)".dependencies]
# The effective user id (safe bindings; no `unsafe` here); 0.3.8: asking an
# app that lost its window to quit (`apps::quit`, SIGTERM).
nix = { workspace = true, features = ["user", "fs", "signal"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { version = "1.53.3", default-features = false, features = ["net", "rt", "macros", "io-util", "time"] }
