[package]
name = "juggler-stats"
description = "Opt-in usage statistics: on-device weekly counters and identifier-free reports (D-19, ADR-0015)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
flate2 = "1.1"
getrandom = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
# The flush budget is measured as thread CPU time.
cpu-time = "1"
# The parity test compares in schema order.
serde_json = { version = "1", features = ["preserve_order"] }
tempfile = "3.27.0"
