[package]
name = "juggler-adapter"
description = "The HarnessAdapter contract: capabilities, discovery, launch specs, session watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = "2.13.2"
juggler-core = { version = "0.4.0", path = "../juggler-core" }
# Whether a system tool is safe to run (file_trust).
juggler-platform = { version = "0.4.0", path = "../juggler-platform" }
# A large transcript's marker lines, found without parsing every line.
memchr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
