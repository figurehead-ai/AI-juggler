[package]
name = "juggler-adapter"
description = "The HarnessAdapter contract: capabilities, discovery, launch specs, session watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = "2.13.2"
juggler-core = { version = "0.0.1", path = "../juggler-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"

[target."cfg(unix)".dependencies]
# The effective user id for file_trust (safe bindings; no `unsafe` here).
nix = { version = "0.31.3", features = ["user"] }

[dev-dependencies]
tempfile = "3.27.0"
