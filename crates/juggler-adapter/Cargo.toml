[package]
name = "juggler-adapter"
description = "The HarnessAdapter contract: capabilities, discovery, launch specs, session watching."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
bitflags = "2.13.2"
juggler-core = { version = "0.2.0", path = "../juggler-core" }
# Whether a system tool is safe to run (file_trust).
juggler-platform = { version = "0.2.0", path = "../juggler-platform" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
