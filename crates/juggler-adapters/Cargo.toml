[package]
name = "juggler-adapters"
description = "Concrete harness adapters: Claude Code, Codex, ZCode, and the fake harness used in tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
juggler-adapter = { version = "0.4.0", path = "../juggler-adapter" }
juggler-core = { version = "0.4.0", path = "../juggler-core" }
notify = "8.2.0"
rusqlite = { workspace = true, features = ["bundled"] }
# AJ-E1520 (0.3): fast substring search over long transcript lines.
memchr = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
# AJ-E1603 R3: the per-run secret of a self-started `kimi web`, and the
# server token held only for its one request.
getrandom = { workspace = true }
zeroize = { workspace = true }
toml = { workspace = true }
# AJ-E1508: one setting set and taken out of a config.toml, the rest kept.
toml_edit = "0.25.17"
zstd = { workspace = true }

[dev-dependencies]
# ADR-0031: the live move sends its link to one process (`apps::send_link`).
juggler-platform = { version = "0.4.0", path = "../juggler-platform" }
# The real-size switch run drives the real pipeline (tests/switch_real_size.rs).
juggler-handover = { version = "0.4.0", path = "../juggler-handover" }
tempfile = { workspace = true }

[[bin]]
name = "fake-harness"
path = "src/bin/fake_harness.rs"

[[bin]]
name = "fake-desktop"
path = "src/bin/fake_desktop.rs"

# AJ-E2303: a stand-in for Codex's app-server (tests only).
[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"

# AJ-E1603 R3: a stand-in for Kimi Code's `kimi web` (tests only).
[[bin]]
name = "fake-kimi"
path = "src/bin/fake_kimi.rs"

# AJ-E2308: a stand-in for Claude Code's headless stream-json (tests only).
[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
