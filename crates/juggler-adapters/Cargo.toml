[package]
name = "juggler-adapters"
description = "Concrete harness adapters: Claude Code, Codex, ZCode, and the fake harness used in tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
juggler-adapter = { version = "0.4.0", path = "../juggler-adapter" }
juggler-core = { version = "0.4.0", path = "../juggler-core" }
notify = "8.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# AJ-E1520 (0.3): fast substring search over long transcript lines.
memchr = "2.8.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
toml = "1"
# AJ-E1508: one setting set and taken out of a config.toml, the rest kept.
toml_edit = "0.25.17"
zstd = "0.14"

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "fake-harness"
path = "src/bin/fake_harness.rs"

[[bin]]
name = "fake-desktop"
path = "src/bin/fake_desktop.rs"

# AJ-E2303: a stand-in for Codex's app-server (tests only).
[[bin]]
name = "fake-codex"
path = "src/bin/fake_codex.rs"

# AJ-E2308: a stand-in for Claude Code's headless stream-json (tests only).
[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
