[[audits.cookie]]
who = "claude-opus for AI Juggler"
criteria = "safe-to-deploy"
delta = "0.18.2 -> 0.18.3"
notes = """
RUSTSEC-2026-0594 (private-cookie AES-GCM nonces could repeat after fork()).
The only code change: PrivateJar's nonce comes from rand's OsRng instead of
