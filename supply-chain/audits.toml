[[audits.sentry]]
who = "claude-opus for AI Juggler"
criteria = "safe-to-deploy"
version = "0.49.5"
notes = """
D-108 crash reports. Built with default-features = false: the client only,
with no transport, integration, session, log or metric code. Reviewed for
safe-to-deploy: build.rs only defines cfg aliases (no network, no code
generation); environment reads only in apply_defaults and init, which AI
Juggler never calls; no process, socket or file access in the code built.
Checked again by the coordinating session the same day against the source
(no unsafe; std::env only in defaults.rs; crash_sentry.rs builds
ClientOptions::new() with default_integrations off and never init).
"""

