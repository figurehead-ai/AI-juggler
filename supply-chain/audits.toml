[[audits.url]]
who = "claude-opus for AI Juggler"
criteria = "safe-to-deploy"
delta = "2.5.8 -> 2.5.9"
notes = """
RUSTSEC-2026-0592 (a stack overflow in Url::origin()): a blob URL's origin is
taken only from an inner http, https or file URL, else opaque. The rest are
WHATWG conformance fixes: the query and path percent-encode sets, a file
host's handling, a backslash only where the scheme is special, and the path
segment pop bound to the path's start. No new unsafe (the two existing
from_utf8_unchecked uses are unchanged), no file, network, process or
environment access, no build script; percent-encoding's lower bound rises to
2.3.2, already the locked version.
"""
