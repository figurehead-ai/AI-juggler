# cargo-deny policy — see https://embarkstudios.github.io/cargo-deny/
# Enforced in CI on every PR (docs/plan/QUALITY.md §6).

[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # The Mozilla root-certificate list (`webpki-root-certs`, pulled in by
    # Tauri's HTTP client for the updater): a permissive data licence.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# AJ-E2007 R2: no dependency ships a native executable or an interpreted
# script that its build could run; a crate that needs one is named below
# with what it ships and why.
[bans.build]
executables = "deny"
interpreted = "deny"
include-dependencies = true
include-workspace = false
include-archives = true
enable-builtin-globs = true
# Each crate's flagged files, by exact path (a few by glob), with why. A new
# file in a later version fails until it's looked at and named here.
bypass = [
    # Windows import libraries and DLLs, linked only when building for Windows.
    { crate = "winapi-i686-pc-windows-gnu", allow-globs = ["lib/*.a"] },
    { crate = "winapi-x86_64-pc-windows-gnu", allow-globs = ["lib/*.a"] },
    { crate = "windows_aarch64_gnullvm", allow-globs = ["lib/libwindows.0.52.0.a", "lib/libwindows.0.53.0.a", "lib/libwindows.a"] },
    { crate = "windows_aarch64_msvc", allow-globs = ["lib/windows.0.52.0.lib", "lib/windows.0.53.0.lib", "lib/windows.lib"] },
    { crate = "windows_i686_gnu", allow-globs = ["lib/libwindows.0.52.0.a", "lib/libwindows.0.53.0.a", "lib/libwindows.a"] },
    { crate = "windows_i686_gnullvm", allow-globs = ["lib/libwindows.0.52.0.a", "lib/libwindows.0.53.0.a"] },
    { crate = "windows_i686_msvc", allow-globs = ["lib/windows.0.52.0.lib", "lib/windows.0.53.0.lib", "lib/windows.lib"] },
    { crate = "windows_x86_64_gnu", allow-globs = ["lib/libwindows.0.52.0.a", "lib/libwindows.0.53.0.a", "lib/libwindows.a"] },
    { crate = "windows_x86_64_gnullvm", allow-globs = ["lib/libwindows.0.52.0.a", "lib/libwindows.0.53.0.a", "lib/libwindows.a"] },
    { crate = "windows_x86_64_msvc", allow-globs = ["lib/windows.0.52.0.lib", "lib/windows.0.53.0.lib", "lib/windows.lib"] },
    { crate = "webview2-com-sys", allow-globs = ["arm64/WebView2Loader.dll", "arm64/WebView2Loader.dll.lib", "arm64/WebView2LoaderStatic.lib", "x64/WebView2Loader.dll", "x64/WebView2Loader.dll.lib", "x64/WebView2LoaderStatic.lib", "x86/WebView2Loader.dll", "x86/WebView2Loader.dll.lib", "x86/WebView2LoaderStatic.lib"] },
    { crate = "libloading", allow-globs = ["tests/nagisa32.dll", "tests/nagisa64.dll"] },
    { crate = "wit-bindgen", allow-globs = ["src/rt/libwit_bindgen_cabi.a"] },
    # JavaScript the crate embeds in the web view or ships as its JS API (Tauri's own and its plugins'), not run by a build.
    { crate = "tauri", allow-globs = ["scripts/bundle.global.js", "scripts/core.js", "scripts/freeze_prototype.js", "scripts/init.js", "scripts/ipc-protocol.js", "scripts/ipc.js", "scripts/isolation.js", "scripts/pattern.js", "scripts/process-ipc-message-fn.js", "src/event/init.js", "src/path/init.js", "src/webview/scripts/print.js", "src/webview/scripts/toggle-devtools.js", "src/webview/scripts/zoom-hotkey.js", "src/window/scripts/drag.js"] },
    { crate = "tauri-plugin-dialog", allow-globs = ["api-iife.js", "src/init-iife.js"] },
    { crate = "tauri-plugin-fs", allow-globs = ["api-iife.js"] },
    { crate = "tauri-plugin-global-shortcut", allow-globs = ["api-iife.js"] },
    { crate = "tauri-plugin-notification", allow-globs = ["api-iife.js", "src/init-iife.js"] },
    { crate = "tauri-plugin-opener", allow-globs = ["api-iife.js", "src/init-iife.js"] },
    { crate = "tauri-plugin-updater", allow-globs = ["api-iife.js"] },
    { crate = "tauri-utils", allow-globs = ["src/pattern/isolation.js"] },
    { crate = "js-sys", allow-globs = ["src/futures/task/worker.js"] },
    { crate = "wasm-bindgen-macro", allow-globs = ["src/worker.js"] },
    { crate = "serialize-to-javascript", allow-globs = ["tests/keygen.js"] },
    { crate = "wasm-streams", allow-globs = ["tests/js/readable_stream.js", "tests/js/transform_stream.js", "tests/js/writable_stream.js"] },
    { crate = "wry", allow-globs = ["examples/custom_protocol/script.js"] },
    { crate = "screencapturekit", allow-globs = ["examples/22_tauri_app/src/main.js"] },
    # ring's perlasm generators: crates.io builds use the pregenerated assembly; perl runs only from a git checkout.
    { crate = "ring", allow-globs = ["crypto/**/*.pl"] },
    # Maintainers' scripts shipped in the package (tests, CI, code generation, examples); no build script runs them.
    { crate = "bit-vec", allow-globs = ["crusader.sh"] },
    { crate = "brotli-decompressor", allow-globs = ["scripts/dict_corpus/generate.py", "src/bin/ipsum_gen.py"] },
    { crate = "cookie", allow-globs = ["scripts/test.sh"] },
    { crate = "curve25519-dalek", allow-globs = ["tests/build_tests.sh"] },
    { crate = "darling", allow-globs = ["compiletests.sh"] },
    { crate = "debugid", allow-globs = ["scripts/bump-version.sh"] },
    { crate = "glow", allow-globs = ["generate-native.sh"] },
    { crate = "jni", allow-globs = [".github/workflows/run_invocation_tests.sh", ".github/workflows/run_windows_invocation_tests.ps1", ".github/workflows/shellcheck.sh", "example/HelloWorld.java", "test_profile"] },
    { crate = "keyboard-types", allow-globs = ["convert.py"] },
    { crate = "kqueue", allow-globs = ["ci/build.sh", "ci/post.sh"] },
    { crate = "libdbus-sys", allow-globs = ["vendor/dbus/autogen.sh", "vendor/dbus/cleanup-man-pages.sh"] },
    { crate = "ndk-sys", allow-globs = ["generate_bindings.sh"] },
    { crate = "open", allow-globs = ["src/powershell.ps1"] },
    { crate = "proptest", allow-globs = ["test-persistence-location/run-tests.bat", "test-persistence-location/run-tests.sh"] },
    { crate = "redox_syscall", allow-globs = ["src/scheme/generate.sh"] },
    { crate = "renderdoc-sys", allow-globs = ["generate_bindings.sh"] },
    { crate = "rustls-platform-verifier", allow-globs = ["src/tests/verification_mock/ca.go"] },
    { crate = "serial2", allow-globs = ["check-targets"] },
    { crate = "sharded-slab", allow-globs = ["bin/loom.sh"] },
    { crate = "target-lexicon", allow-globs = [".github/actions/install-rust/main.js", "scripts/rust-targets.sh"] },
    { crate = "tracing", allow-globs = ["test-macros/bin/macro-results.sh"] },
    { crate = "unicode-width", allow-globs = ["scripts/unicode.py"] },
    { crate = "untrusted", allow-globs = ["mk/cargo.sh", "mk/install-build-tools.sh", "mk/runner"] },
    { crate = "vcpkg", allow-globs = ["setup_vcp.sh", "tests/run.sh", "tests/vcpkgrs_target.sh"] },
    { crate = "walkdir", allow-globs = ["compare/walk.py"] },
    { crate = "xattr", allow-globs = [".github/workflows/run-on-host.sh"] },
    { crate = "zerocopy", allow-globs = ["cargo.sh", "ci/check_all_toolchains_tested.sh", "ci/check_fmt.sh", "ci/check_msrv_is_minimal.sh", "ci/check_packaging.sh", "ci/check_readme.sh", "ci/check_stale_stderr.sh", "ci/check_versions.sh", "ci/release_crate_version.sh", "win-cargo.bat"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2024-0370 — proc-macro-error 1.0.4 is unmaintained (build-time
    # proc-macro crate, not a vulnerability). Transitive via gtk3-macros /
    # webkit2gtk in Tauri's Linux webview stack; no fixed release exists
    # upstream. Risk assessed 2026-10-12: compile-time only, zero runtime
    # exposure. Remove when gtk-rs ships an update.
    "RUSTSEC-2024-0370",
    # AJ-E505 (2026-10-13): `paste` is unmaintained (RUSTSEC-2024-0436,
    # an UNMAINTAINED notice — no soundness/security vulnerability).
    # Transitive via netstat2's netlink-packet chain; macro-only
    # build-time code. Remove when netstat2 drops the netlink macro dep.
    "RUSTSEC-2024-0436",
    # AJ-E302 (2026-10-17): the zbus support crates were folded back
    # into the main zbus release and stand-alone versions are
    # unmaintained (RUSTSEC-2026-0370/0371/0372 — UNMAINTAINED
    # notices, no vulnerability). Transitive via zbus 5.19 in Tauri's
    # Linux portal/clipboard stack. Remove when Tauri bumps zbus past
    # the fold-in release.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]
