<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>AI Juggler</title>
    <script src="/theme-boot.js"></script>
    <style>
      /* While the app's code loads: its mark and one line, in the window's
         theme. It fades in only after a moment, so a fast Mac never sees
         it; the app replaces it as soon as it starts. */
      html { background: #0a0d13; }
      html[data-theme="light"] { background: #f7f8fb; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        color: #8b95a7; opacity: 0; animation: boot-in 0.25s ease-out 0.3s forwards;
      }
      html[data-theme="light"] #boot { color: #57607a; }
      #boot svg { width: 56px; height: 56px; }
      #boot .a { fill: #7c7cf4; } #boot .b { fill: #9d9dfb; } #boot .c { fill: #22d3ee; }
      html[data-theme="light"] #boot .a { fill: #5555e1; }
      html[data-theme="light"] #boot .b { fill: #4646e0; }
      html[data-theme="light"] #boot .c { fill: #056074; }
      #boot .arc { stroke: currentColor; stroke-opacity: 0.35; }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-toss { 50% { transform: translateY(-2px); } }
      @media (prefers-reduced-motion: no-preference) {
        #boot .b { animation: boot-toss 0.9s ease-in-out infinite; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="arc" d="M6.8 16C8.4 7.4 15.6 7.4 17.2 16" stroke-width="1.25" stroke-dasharray="2.2 2.6" fill="none" />
          <circle class="a" cx="6.8" cy="16" r="2.3" />
          <circle class="b" cx="12" cy="8.6" r="2.5" />
          <circle class="c" cx="17.2" cy="16" r="2.3" />
        </svg>
        Opening AI Juggler…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
