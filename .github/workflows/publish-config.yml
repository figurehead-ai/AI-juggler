# ADR-0035 §8, D-129: publish one channel's signed remote configuration
# to https://config.figurehead.ai/v1/<channel>.json.
#
# New or changed content: `publish`, run by hand for one channel, in the
# `release` environment behind the same approval as Promote. The source is
# a reviewed, unsigned file in the repository (config/remote/<channel>.json):
#   1. validate it against the section schemas the app's build exports
#      (config/remote/schema.json, kept current by a test);
#   2. canonicalise it (the tool signs canonical bytes only);
#   3. serial = the live file's + 1 (read with curl, its signature checked);
#   4. issued_at now, expires_at 14 days on;
#   5. sign with REMOTE_CONFIG_SIGNING_KEY, carrying the live file's
#      revocation lists over;
#   6. verify the signed file with the same crate as the app;
#   7. upload it to R2;
#   8. smoke-check the public URL (200, application/json), then fetch and
#      verify it again.
#
# Weekly, unattended (a file lives 14 days): `resign` in the
# `config-resign` environment (no reviewer, `main` only, the signing
# secret only) signs the live file's own content again with only a new
# serial and dates; it reads no source, and the tool refuses a result
# whose canonical content differs from the live file's by a byte. Then
# `resign-upload` in the `config-upload` environment (no reviewer, `main`
# only, the storage secrets only) checks that again against the live file
# as it is then, and uploads it. The signer can't upload; the uploader
# can't sign, and can only put up a re-sign of what is already live.
#
# Daily, `expiry` (no environment, no secret) fails when a live file is
# within 3 days of expiry, so a re-sign that didn't happen is seen in time.
#
# Secrets, by environment (names only): `release`:
# REMOTE_CONFIG_SIGNING_KEY, R2_CONFIG_ACCESS_KEY_ID,
# R2_CONFIG_SECRET_ACCESS_KEY; `config-resign`: REMOTE_CONFIG_SIGNING_KEY;
# `config-upload`: R2_CONFIG_ACCESS_KEY_ID, R2_CONFIG_SECRET_ACCESS_KEY.
# docs/RELEASING.md "Remote configuration".
name: Publish config

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel whose file to publish"
        type: choice
        options: [nightly, beta, stable]
        required: true
      source:
        description: "Source file in the repository (default: config/remote/<channel>.json)"
        type: string
        required: false
        default: ""
  schedule:
    # The weekly re-sign (Mondays).
    - cron: "17 6 * * 1"
    # The daily expiry check.
    - cron: "43 7 * * *"

permissions: {}

concurrency:
  group: publish-config-${{ inputs.channel || github.event.schedule }}
  cancel-in-progress: false

env:
  BASE_URL: https://config.figurehead.ai/v1
  CARGO_TERM_COLOR: never

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      resign: ${{ steps.plan.outputs.resign }}
      check: ${{ steps.plan.outputs.check }}
    steps:
      - name: Which channels
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          all='["nightly","beta","stable"]'
          publish='[]' resign='[]' check='[]'
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$CHANNEL" =~ ^(nightly|beta|stable)$ ]] || { echo "::error::bad channel $CHANNEL"; exit 1; }
            publish="[\"$CHANNEL\"]"
          elif [ "$SCHEDULE" = "17 6 * * 1" ]; then
            resign="$all"
          else
            check="$all"
          fi
          { echo "publish=$publish"; echo "resign=$resign"; echo "check=$check"; } >> "$GITHUB_OUTPUT"

  # Daily: no environment, no secret. Fails when a live file is within 3
  # days of expiry, or is there but doesn't verify.
  expiry:
    name: expiry ${{ matrix.channel }}
    needs: plan
    if: needs.plan.outputs.check != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.check) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tool
        run: cargo build --locked --release -p juggler-remote-config --bin remote-config-publish
      - name: The live file's expiry
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -euo pipefail
          tool=target/release/remote-config-publish
          live="$RUNNER_TEMP/live.json"
          code="$(curl -sS --proto '=https' --max-redirs 0 --max-time 30 -o "$live" -w '%{http_code}' "$BASE_URL/$CHANNEL.json")"
          if [ "$code" = 404 ]; then
            echo "::notice::$CHANNEL: no file published yet"
            exit 0
          fi
          [ "$code" = 200 ] || { echo "::error::$CHANNEL: HTTP $code"; exit 1; }
          "$tool" inspect --file "$live" --channel "$CHANNEL" > "$RUNNER_TEMP/live.txt"
          expires_at="$(sed -n 's/^expires_at=//p' "$RUNNER_TEMP/live.txt")"
          left=$(( expires_at - $(date +%s) ))
          echo "$CHANNEL expires in $(( left / 3600 )) h" >> "$GITHUB_STEP_SUMMARY"
          if [ "$left" -lt $(( 3 * 86400 )) ]; then
            echo "::error::$CHANNEL's live configuration expires within 3 days: the weekly re-sign didn't land; run Publish config for it"
            exit 1
          fi

  publish:
    name: publish ${{ matrix.channel }}
    needs: plan
    if: needs.plan.outputs.publish != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # The approval: the same environment the release keys live in.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.publish) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tool
        run: cargo build --locked --release -p juggler-remote-config --bin remote-config-publish
      - name: 1. Validate the source against the section schemas
        id: source
        run: |
          set -euo pipefail
          source="${SOURCE:-config/remote/$CHANNEL.json}"
          # Only a reviewed file under config/remote/, never a path elsewhere.
          [[ "$source" =~ ^config/remote/[a-z0-9_-]+\.json$ ]] && [ "$source" != config/remote/schema.json ] \
            || { echo "::error::the source is a config/remote/<name>.json file"; exit 1; }
          target/release/remote-config-publish validate \
            --schema config/remote/schema.json --source "$source" --channel "$CHANNEL"
          echo "path=$source" >> "$GITHUB_OUTPUT"
      - name: 3. The live file and the next serial
        id: serial
        run: |
          set -euo pipefail
          live="$RUNNER_TEMP/live.json"
          code="$(curl -sS --proto '=https' --max-redirs 0 --max-time 30 -o "$live" -w '%{http_code}' "$BASE_URL/$CHANNEL.json")"
          case "$code" in
            200) serial="$(target/release/remote-config-publish next-serial --channel "$CHANNEL" --live "$live")"
                 echo "live=$live" >> "$GITHUB_OUTPUT" ;;
            404) serial="$(target/release/remote-config-publish next-serial --channel "$CHANNEL")"
                 echo "live=" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::$BASE_URL/$CHANNEL.json: HTTP $code"; exit 1 ;;
          esac
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
      - name: 2, 4, 5. Canonicalise, stamp (14 days) and sign
        env:
          REMOTE_CONFIG_SIGNING_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_KEY }}
          SOURCE_PATH: ${{ steps.source.outputs.path }}
          SERIAL: ${{ steps.serial.outputs.serial }}
          LIVE: ${{ steps.serial.outputs.live }}
        run: |
          set -euo pipefail
          [ -n "$REMOTE_CONFIG_SIGNING_KEY" ] || { echo "::error::REMOTE_CONFIG_SIGNING_KEY is not set in the release environment"; exit 1; }
          target/release/remote-config-publish sign \
            --schema config/remote/schema.json --source "$SOURCE_PATH" --channel "$CHANNEL" \
            --serial "$SERIAL" --now "$(date +%s)" --days 14 ${LIVE:+--live "$LIVE"} \
            --out "$RUNNER_TEMP/$CHANNEL.json"
      - name: 6. Verify it as the app does
        env:
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: target/release/remote-config-publish verify --file "$RUNNER_TEMP/$CHANNEL.json" --channel "$CHANNEL" --serial "$SERIAL"
      - name: Keep the signed file (audit)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-config-${{ matrix.channel }}-${{ steps.serial.outputs.serial }}
          path: ${{ runner.temp }}/${{ matrix.channel }}.json
          retention-days: 90
      - name: 7. Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CONFIG_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CONFIG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          aws s3 cp "$RUNNER_TEMP/$CHANNEL.json" "s3://figurehead-config/v1/$CHANNEL.json" \
            --endpoint-url https://8f0dd95e3750b5d173fca59fae54401b.r2.cloudflarestorage.com \
            --region auto --content-type application/json --cache-control "public, max-age=300"
      - name: 8. Smoke-check the public file
        env:
          SERIAL: ${{ steps.serial.outputs.serial }}
        run: |
          set -euo pipefail
          # A query of its own so the check reads the new file, not a copy
          # cached before it (the app never sends one).
          url="$BASE_URL/$CHANNEL.json?publish=$SERIAL"
          headers="$(curl -sSI --proto '=https' --max-redirs 0 --max-time 30 "$url")"
          echo "$headers" | head -1 | grep -qE '^HTTP/[0-9.]+ 200' || { echo "::error::not 200: $(echo "$headers" | head -1)"; exit 1; }
          echo "$headers" | grep -qiE '^content-type: *application/json' || { echo "::error::not application/json"; exit 1; }
          curl -sSf --proto '=https' --max-redirs 0 --max-time 30 -o "$RUNNER_TEMP/served.json" "$url"
          target/release/remote-config-publish verify --file "$RUNNER_TEMP/served.json" --channel "$CHANNEL" --serial "$SERIAL"
          echo "$CHANNEL → serial $SERIAL" >> "$GITHUB_STEP_SUMMARY"

  # Weekly, no reviewer: the live content, signed again, nothing else.
  resign:
    name: re-sign ${{ matrix.channel }}
    needs: plan
    if: needs.plan.outputs.resign != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # `main` only, no reviewer, the signing secret only.
    environment: config-resign
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.resign) }}
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tool
        run: cargo build --locked --release -p juggler-remote-config --bin remote-config-publish
      - name: Re-sign the live content (serial and dates only)
        env:
          REMOTE_CONFIG_SIGNING_KEY: ${{ secrets.REMOTE_CONFIG_SIGNING_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/resign" && mkdir -p "$out"
          code="$(curl -sS --proto '=https' --max-redirs 0 --max-time 30 -o "$out/live.json" -w '%{http_code}' "$BASE_URL/$CHANNEL.json")"
          if [ "$code" = 404 ]; then
            echo "::notice::$CHANNEL: nothing published yet, nothing to re-sign"
            : > "$out/none"
            exit 0
          fi
          [ "$code" = 200 ] || { echo "::error::$CHANNEL: HTTP $code"; exit 1; }
          [ -n "$REMOTE_CONFIG_SIGNING_KEY" ] || { echo "::error::REMOTE_CONFIG_SIGNING_KEY is not set in config-resign"; exit 1; }
          target/release/remote-config-publish resign --live "$out/live.json" --channel "$CHANNEL" \
            --now "$(date +%s)" --days 14 --out "$out/$CHANNEL.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resign-${{ matrix.channel }}
          path: ${{ runner.temp }}/resign/
          retention-days: 90

  # Uploads only a re-sign of what is live now.
  resign-upload:
    name: upload re-signed ${{ matrix.channel }}
    needs: [plan, resign]
    if: needs.plan.outputs.resign != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    # `main` only, no reviewer, the storage secrets only.
    environment: config-upload
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.resign) }}
    env:
      CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resign-${{ matrix.channel }}
          path: ${{ runner.temp }}/resign/
      - name: The tool
        run: cargo build --locked --release -p juggler-remote-config --bin remote-config-publish
      - name: Check it against the live file, then upload and smoke-check
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_CONFIG_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_CONFIG_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/resign"
          [ -e "$dir/none" ] && { echo "::notice::$CHANNEL: nothing to upload"; exit 0; }
          tool=target/release/remote-config-publish
          # The live file as it is now: a publish since the re-sign makes
          # this refuse (its content would be undone).
          curl -sSf --proto '=https' --max-redirs 0 --max-time 30 -o "$dir/now.json" "$BASE_URL/$CHANNEL.json"
          "$tool" check-resign --live "$dir/now.json" --file "$dir/$CHANNEL.json" --channel "$CHANNEL"
          "$tool" verify --file "$dir/$CHANNEL.json" --channel "$CHANNEL"
          aws s3 cp "$dir/$CHANNEL.json" "s3://figurehead-config/v1/$CHANNEL.json" \
            --endpoint-url https://8f0dd95e3750b5d173fca59fae54401b.r2.cloudflarestorage.com \
            --region auto --content-type application/json --cache-control "public, max-age=300"
          serial="$("$tool" inspect --file "$dir/$CHANNEL.json" --channel "$CHANNEL" | sed -n 's/^serial=//p')"
          url="$BASE_URL/$CHANNEL.json?publish=$serial"
          headers="$(curl -sSI --proto '=https' --max-redirs 0 --max-time 30 "$url")"
          echo "$headers" | head -1 | grep -qE '^HTTP/[0-9.]+ 200' || { echo "::error::not 200"; exit 1; }
          echo "$headers" | grep -qiE '^content-type: *application/json' || { echo "::error::not application/json"; exit 1; }
          curl -sSf --proto '=https' --max-redirs 0 --max-time 30 -o "$dir/served.json" "$url"
          "$tool" verify --file "$dir/served.json" --channel "$CHANNEL" --serial "$serial"
          echo "$CHANNEL re-signed → serial $serial" >> "$GITHUB_STEP_SUMMARY"
