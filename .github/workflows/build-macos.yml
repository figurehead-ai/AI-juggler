# D-20: build, sign and notarize one AI Juggler version, and publish it
# as a pre-release with its update feeds: `latest.json` (AI Juggler) and
# `latest-nightly.json` (AI Juggler Nightly, D-23). Called by
# nightly.yml; promote.yml later points the beta and stable channels at
# the same build. Nothing is ever rebuilt for a channel.
#
# AJ-E2001: no build or dependency code ever runs where the signing keys
# are. Four jobs:
# - preflight (`release` environment): every signing secret is there, or
#   nothing is built (fails closed). It runs no code from the repository.
# - build (no secrets, read-only token): compiles each edition unsigned
#   and uploads the `.app`. Every crate's build script and `pnpm build`
#   run here, and only here.
# - sign (`release` environment, no repository token): signs, notarizes
#   and staples each app and its disk image, makes and signs the updater
#   archive, and checks all of it — with Apple's tools, the pinned
#   prebuilt tauri-cli and scripts/sign_macos.sh. It builds nothing.
# - publish: the only job allowed to write to the repository.
#
# `dry_run` (release-rehearsal.yml) builds for real and rehearses the
# signing with an ad-hoc signature and a throwaway updater key: no secret
# is read, nothing is notarized or published.
#
# No build cache is restored: a signed build starts from a clean runner so
# nothing another workflow wrote can end up inside it.
name: Build (macOS)

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "X.Y.Z (release_version.py next)"
        type: string
        required: true
      previous:
        description: "Commit of the previous nightly (release notes since then); empty for the first"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build, rehearse signing without secrets, publish nothing"
        type: boolean
        required: false
        default: false

# Each job asks for what it needs, nothing more.
permissions: {}

jobs:
  preflight:
    name: preflight
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Every signing secret is set (fails closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AIJ_UPDATER_PUBKEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          # Notarization: an App Store Connect API key (preferred), or an
          # Apple ID with an app-specific password.
          if [ -n "$APPLE_API_KEY$APPLE_API_KEY_ID$APPLE_API_ISSUER" ]; then
            for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
              [ -n "${!name}" ] || missing+=("$name")
            done
            echo "Notarization: App Store Connect API key" >> "$GITHUB_STEP_SUMMARY"
          else
            for name in APPLE_ID APPLE_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name (or an App Store Connect API key)")
            done
            echo "Notarization: Apple ID and app-specific password" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not building — missing: ${missing[*]} (docs/RELEASING.md § One-time setup)"
            exit 1
          fi

  build:
    name: build ${{ matrix.edition }}
    needs: preflight
    # Runs after a passed preflight, or without one in a dry run.
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || (inputs.dry_run && needs.preflight.result == 'skipped')) }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            overlay: ""
            label: ""
          - edition: nightly
            overlay: crates/juggler-app/tauri.nightly.conf.json
            label: Nightly
    env:
      VERSION: ${{ inputs.version }}
      OVERLAY: ${{ matrix.overlay }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Version and notes
        env:
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          # The version is stamped into this checkout only (never committed).
          python3 scripts/release_version.py stamp "$VERSION"
          # Nightly notes from the commits since the previous nightly; a
          # version that already has hand-written notes keeps them.
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          # A database change since the previous nightly needs a downgrade
          # note (nightly_notes.py writes it; hand-written notes must too).
          ./scripts/release_notes_check.sh "$VERSION" ${PREVIOUS:+"$PREVIOUS"}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Toolchain (pinned)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # tauri-cli: Tauri's prebuilt release, checked against its digest.
          ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"
          # pnpm: the exact version and hash in ui/package.json's
          # packageManager, which corepack checks.
          corepack enable
          (cd ui && corepack install)
          pnpm --dir ui install --frozen-lockfile

      - name: Icon
        # Generated from the brand PNG at build time; no generated binaries
        # live in the repository. AI Juggler Nightly's carries a "Nightly"
        # band (D-23).
        env:
          LABEL: ${{ matrix.label }}
        run: |
          source=crates/juggler-app/icons/icon.png
          if [ -n "$LABEL" ]; then
            swift scripts/edition_icon.swift "$source" "$RUNNER_TEMP/edition.png" "$LABEL" 6D28D9
            source="$RUNNER_TEMP/edition.png"
          fi
          cargo tauri icon "$source" --output "$RUNNER_TEMP/icons"

      - name: Build the app, unsigned (universal)
        env:
          # Public: baked into the app as the key its updater verifies.
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          config=$(python3 - <<'PY'
          import json, os
          overlay = os.environ["OVERLAY"]
          config = json.load(open(overlay)) if overlay else {}
          config.pop("$schema", None)
          icons = os.environ["RUNNER_TEMP"] + "/icons"
          config["bundle"] = {
            "active": True,
            "targets": ["app"],
            # The updater archive is made from the signed, stapled app in
            # the sign job; nothing here can sign it.
            "createUpdaterArtifacts": False,
            "icon": [icons + "/icon.icns", icons + "/icon.png"],
            "macOS": {"minimumSystemVersion": "14.0"},
          }
          config["plugins"] = {"updater": {"pubkey": os.environ.get("AIJ_UPDATER_PUBKEY", ""), "requireSignedVersion": True}}
          print(json.dumps(config))
          PY
          )
          # From the repository root, as `just app` does: that's where the
          # Tauri CLI finds the UI project (ui/) and runs `pnpm build` in it.
          cargo tauri build --target universal-apple-darwin --config "$config"
          bundle=target/universal-apple-darwin/release/bundle/macos
          out="$RUNNER_TEMP/unsigned" && mkdir -p "$out"
          # A tar keeps the bundle's modes and links (an artifact wouldn't).
          (cd "$bundle" && tar -cf "$out/app.tar" ./*.app)
          tar -tf "$out/app.tar" | head -3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.edition }}
          path: ${{ runner.temp }}/unsigned/
          retention-days: 3
          if-no-files-found: error

  sign:
    name: sign ${{ matrix.edition }}
    needs: build
    runs-on: macos-latest
    # Apple's notary service can take most of an hour for a new team's
    # first submissions, and each edition waits for it twice (app, disk
    # image).
    timeout-minutes: 240
    # The release keys exist only here (the environment allows `main`
    # only). A dry run rehearses this job without them.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    # Read-only: the sparse checkout of the signing scripts.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            prefix: AI-Juggler
          - edition: nightly
            prefix: AI-Juggler-Nightly
    env:
      VERSION: ${{ inputs.version }}
      PREFIX: ${{ matrix.prefix }}
    steps:
      # The signing scripts only, from the commit being released.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign_macos.sh
            scripts/apple_retry.py
            scripts/updater_sig_check.py
            scripts/install_tauri_cli.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ matrix.edition }}
          path: ${{ runner.temp }}/unsigned/

      - name: Pinned tauri-cli (for `signer sign`)
        run: ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"

      - name: Rehearse signing (dry run; no secrets)
        if: ${{ inputs.dry_run }}
        env:
          REHEARSAL: "1"
        run: ./scripts/sign_macos.sh "$RUNNER_TEMP/unsigned/app.tar" "$RUNNER_TEMP/assets"

      - name: Sign, notarize, staple; the updater archive; verify
        if: ${{ !inputs.dry_run }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: ./scripts/sign_macos.sh "$RUNNER_TEMP/unsigned/app.tar" "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.dry_run && 'rehearsal' || 'release' }}-${{ matrix.edition }}
          path: ${{ runner.temp }}/assets/
          retention-days: ${{ inputs.dry_run && 3 || 7 }}
          if-no-files-found: error

  publish:
    name: publish
    needs: sign
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # The only job that may write to the repository (the release).
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/assets/
          merge-multiple: true

      - name: Release notes (as the build jobs wrote them)
        env:
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          # A database change since the previous nightly needs a downgrade
          # note (nightly_notes.py writes it; hand-written notes must too).
          ./scripts/release_notes_check.sh "$VERSION" ${PREVIOUS:+"$PREVIOUS"}

      - name: Assemble the update feeds and checksums
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          out = os.environ["RUNNER_TEMP"] + "/assets"
          notes = open(f"docs/releases/{version}.md").read()
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # latest.json: AI Juggler (what beta and stable point at later).
          # latest-nightly.json: AI Juggler Nightly (the nightly feed).
          for feed_name, prefix in (("latest.json", "AI-Juggler"), ("latest-nightly.json", "AI-Juggler-Nightly")):
              archive = f"{prefix}-{version}-universal.app.tar.gz"
              sig = open(f"{out}/{archive}.sig").read().strip()
              url = f"https://github.com/{repository}/releases/download/v{version}/{archive}"
              feed = {
                "version": version,
                "notes": notes,
                "pub_date": date,
                "platforms": {p: {"signature": sig, "url": url} for p in ("darwin-aarch64", "darwin-x86_64")},
              }
              json.dump(feed, open(f"{out}/{feed_name}", "w"), indent=2)
          PY
          (cd "$RUNNER_TEMP/assets" && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the build (pre-release; channels point at it later)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" "$RUNNER_TEMP"/assets/* \
            --repo "$REPOSITORY" \
            --target "$REF" \
            --prerelease \
            --title "${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"
