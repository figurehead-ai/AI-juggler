# D-20: build, sign and notarize one AI Juggler version, and publish it
# as a pre-release with its update feeds: `latest.json` (AI Juggler) and
# `latest-nightly.json` (AI Juggler Nightly, D-23). Called by
# nightly.yml; promote.yml later points the beta and stable channels at
# the same build. Nothing is ever rebuilt for a channel.
#
# Fails closed: without every signing secret nothing is built. No build
# cache is restored: a signed, notarized build starts from a clean runner
# so nothing another workflow wrote can end up inside it.
name: Build (macOS)

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "X.Y.Z (release_version.py next)"
        type: string
        required: true
      previous:
        description: "Commit of the previous nightly (release notes since then); empty for the first"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Preflight — secrets, version, notes (fails closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AIJ_UPDATER_PUBKEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not building — missing: ${missing[*]} (docs/RELEASING.md § One-time setup)"
            exit 1
          fi
          # The version is stamped into this checkout only (never committed).
          python3 scripts/release_version.py stamp "$VERSION"
          # Nightly notes from the commits since the previous nightly; a
          # version that already has hand-written notes keeps them.
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          ./scripts/release_notes_check.sh "$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          corepack enable
          pnpm --dir ui install --frozen-lockfile

      - name: Icons
        # The macOS icon sets are generated from the brand PNG at build
        # time; no generated binaries live in the repository. AI Juggler
        # Nightly's icon carries a "Nightly" band (D-23).
        run: |
          swift scripts/edition_icon.swift crates/juggler-app/icons/icon.png "$RUNNER_TEMP/nightly.png" Nightly 6D28D9
          cd crates/juggler-app
          cargo tauri icon icons/icon.png --output "$RUNNER_TEMP/icons/main"
          cargo tauri icon "$RUNNER_TEMP/nightly.png" --output "$RUNNER_TEMP/icons/nightly"

      - name: Build, sign, notarize and verify both editions (universal)
        # D-23: AI Juggler (promoted later to beta and stable, never
        # rebuilt) and AI Juggler Nightly (the nightly feed), from the same
        # commit. Each has its own bundle id, name, data and icon.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the app: the key its updater verifies against.
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          bundle="$PWD/target/universal-apple-darwin/release/bundle"
          out="$RUNNER_TEMP/assets" && mkdir -p "$out"
          build_edition() {  # edition  overlay-json-or-empty  asset-prefix
            local edition="$1" overlay="$2" prefix="$3" config app dmg
            config=$(EDITION="$edition" OVERLAY="$overlay" python3 - <<'PY'
          import json, os
          config = json.loads(os.environ["OVERLAY"]) if os.environ["OVERLAY"] else {}
          config.pop("$schema", None)
          icons = os.environ["RUNNER_TEMP"] + "/icons/" + os.environ["EDITION"]
          config["bundle"] = {
            "active": True,
            "targets": ["app", "dmg"],
            "createUpdaterArtifacts": True,
            "icon": [icons + "/icon.icns", icons + "/icon.png"],
            "macOS": {"minimumSystemVersion": "14.0"},
          }
          config["plugins"] = {"updater": {"pubkey": os.environ["AIJ_UPDATER_PUBKEY"], "requireSignedVersion": True}}
          print(json.dumps(config))
          PY
            )
            rm -rf "$bundle"
            # From the repository root, as `just app` does: that's where the
            # Tauri CLI finds the UI project (ui/) and runs `pnpm build` in it.
            # From crates/juggler-app it finds none and the UI build fails.
            cargo tauri build --target universal-apple-darwin --config "$config"
            app="$(ls -d "$bundle"/macos/*.app | head -1)"
            dmg="$(ls "$bundle"/dmg/*.dmg | head -1)"
            echo "::group::Verify $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$dmg"
            echo "::endgroup::"
            cp "$dmg" "$out/${prefix}-${VERSION}-universal.dmg"
            cp "$(ls "$bundle"/macos/*.app.tar.gz | head -1)" "$out/${prefix}-${VERSION}-universal.app.tar.gz"
            cp "$(ls "$bundle"/macos/*.app.tar.gz.sig | head -1)" "$out/${prefix}-${VERSION}-universal.app.tar.gz.sig"
          }
          build_edition main "" AI-Juggler
          build_edition nightly "$(cat crates/juggler-app/tauri.nightly.conf.json)" AI-Juggler-Nightly

      - name: Assemble assets (update feeds, checksums)
        run: |
          out="$RUNNER_TEMP/assets"
          python3 - <<PY
          import json, os, datetime
          version = os.environ["VERSION"]
          out = os.environ["RUNNER_TEMP"] + "/assets"
          notes = open(f"docs/releases/{version}.md").read()
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # latest.json: AI Juggler (what beta and stable point at later).
          # latest-nightly.json: AI Juggler Nightly (the nightly feed).
          for feed_name, prefix in (("latest.json", "AI-Juggler"), ("latest-nightly.json", "AI-Juggler-Nightly")):
              archive = f"{prefix}-{version}-universal.app.tar.gz"
              sig = open(f"{out}/{archive}.sig").read().strip()
              url = f"https://github.com/${{ github.repository }}/releases/download/v{version}/{archive}"
              feed = {
                "version": version,
                "notes": notes,
                "pub_date": date,
                "platforms": {p: {"signature": sig, "url": url} for p in ("darwin-aarch64", "darwin-x86_64")},
              }
              json.dump(feed, open(f"{out}/{feed_name}", "w"), indent=2)
          PY
          cp "docs/releases/${VERSION}.md" "$RUNNER_TEMP/notes.md"
          (cd "$out" && shasum -a 256 ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the build (pre-release; channels point at it later)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          gh release create "v${VERSION}" "$RUNNER_TEMP"/assets/* \
            --target "$REF" \
            --prerelease \
            --title "${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
