# D-20: build, sign and notarize one AI Juggler version, and publish it
# as a pre-release with its update feed (`latest.json`). Called by
# nightly.yml; promote.yml later points the beta and stable channels at
# the same build. Nothing is ever rebuilt for a channel.
#
# Fails closed: without every signing secret nothing is built. No build
# cache is restored: a signed, notarized build starts from a clean runner
# so nothing another workflow wrote can end up inside it.
name: Build (macOS)

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "X.Y.Z (release_version.py next)"
        type: string
        required: true
      previous:
        description: "Commit of the previous nightly (release notes since then); empty for the first"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: build-macos
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Preflight — secrets, version, notes (fails closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AIJ_UPDATER_PUBKEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not building — missing: ${missing[*]} (docs/RELEASING.md § One-time setup)"
            exit 1
          fi
          # The version is stamped into this checkout only (never committed).
          python3 scripts/release_version.py stamp "$VERSION"
          # Nightly notes from the commits since the previous nightly; a
          # version that already has hand-written notes keeps them.
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          ./scripts/release_notes_check.sh "$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          corepack enable
          pnpm --dir ui install --frozen-lockfile

      - name: Icons
        # The macOS icon set is generated from the brand PNG at build
        # time; no generated binaries live in the repository.
        run: |
          mkdir -p "$RUNNER_TEMP/icons"
          cd crates/juggler-app && cargo tauri icon icons/icon.png --output "$RUNNER_TEMP/icons"

      - name: Build, sign and notarize (universal)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the app: the key its updater verifies against.
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          config=$(python3 - <<PY
          import json, os
          print(json.dumps({
            "bundle": {
              "active": True,
              "targets": ["app", "dmg"],
              "createUpdaterArtifacts": True,
              "icon": [os.environ["RUNNER_TEMP"] + "/icons/icon.icns", os.environ["RUNNER_TEMP"] + "/icons/icon.png"],
              "macOS": {"minimumSystemVersion": "14.0"}
            },
            "plugins": {"updater": {"pubkey": os.environ["AIJ_UPDATER_PUBKEY"], "requireSignedVersion": True}}
          }))
          PY
          )
          cd crates/juggler-app && cargo tauri build --target universal-apple-darwin --config "$config"

      - name: Verify the signature, notarization and updater signature
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          app="$(ls -d "$bundle"/macos/*.app | head -1)"
          dmg="$(ls "$bundle"/dmg/*.dmg | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$dmg"
          ls "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig

      - name: Assemble assets (installer name, updater feed)
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          out="$RUNNER_TEMP/assets" && mkdir -p "$out"
          cp "$(ls "$bundle"/dmg/*.dmg | head -1)" "$out/AI-Juggler-${VERSION}-universal.dmg"
          cp "$(ls "$bundle"/macos/*.app.tar.gz | head -1)" "$out/AI-Juggler-${VERSION}-universal.app.tar.gz"
          cp "$(ls "$bundle"/macos/*.app.tar.gz.sig | head -1)" "$out/AI-Juggler-${VERSION}-universal.app.tar.gz.sig"
          python3 - <<PY
          import json, os, datetime
          version = os.environ["VERSION"]
          out = os.environ["RUNNER_TEMP"] + "/assets"
          sig = open(f"{out}/AI-Juggler-{version}-universal.app.tar.gz.sig").read().strip()
          url = f"https://github.com/${{ github.repository }}/releases/download/v{version}/AI-Juggler-{version}-universal.app.tar.gz"
          notes = open(f"docs/releases/{version}.md").read()
          feed = {
            "version": version,
            "notes": notes,
            "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "platforms": {p: {"signature": sig, "url": url} for p in ("darwin-aarch64", "darwin-x86_64")},
          }
          json.dump(feed, open(f"{out}/latest.json", "w"), indent=2)
          PY
          cp "docs/releases/${VERSION}.md" "$RUNNER_TEMP/notes.md"
          (cd "$out" && shasum -a 256 ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the build (pre-release; channels point at it later)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          gh release create "v${VERSION}" "$RUNNER_TEMP"/assets/* \
            --target "$REF" \
            --prerelease \
            --title "${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
