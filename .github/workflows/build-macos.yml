# D-20: build, sign and notarize one AI Juggler version, both editions
# (AI Juggler and AI Juggler Nightly, D-23). Called by nightly.yml, which
# publishes it as a pre-release with its update feeds; promote.yml later
# points the beta and stable channels at the same build. Nothing is ever
# rebuilt for a channel.
#
# AJ-E2001: no build or dependency code ever runs where the signing keys
# are. Four jobs here, and the caller publishes:
# - preflight (`release` environment): every signing secret is there, or
#   nothing is built (fails closed). It runs no code from the repository.
# - compile (no secrets, read-only token): each edition for each
#   architecture, unsigned, on its own runner at the same time. Every
#   crate's build script and `pnpm build` run here, and only here.
# - build (no secrets, read-only token): joins each edition's two
#   architectures into the universal app (lipo), bundles it with the
#   compile's configuration and uploads the `.app`. It compiles nothing.
# - sign (`release` environment, no repository token): signs, notarizes
#   and staples each app and its disk image, makes and signs the updater
#   archive, and checks all of it — with Apple's tools, the pinned
#   prebuilt tauri-cli and scripts/sign_macos.sh. It builds nothing, and
#   uploads the `release-<edition>` artifacts.
# This workflow never writes to the repository: the caller's publish job
# (nightly.yml) is the only one that may.
#
# `dry_run` (release-rehearsal.yml) builds for real and rehearses the
# signing with an ad-hoc signature and a throwaway updater key: no secret
# is read, nothing is notarized.
#
# No build cache is restored: a signed build starts from a clean runner so
# nothing another workflow wrote can end up inside it.
#
# The commit to build comes from the run itself, never from an input: the
# pull request's head in a rehearsal on a pull request, otherwise the
# commit the caller was started on (nightly.yml runs only from main). So
# no caller can hand this workflow a branch nobody reviewed while it runs
# with the default branch's cache scope (CodeQL: cache poisoning).
name: Build (macOS)

on:
  workflow_call:
    inputs:
      version:
        description: "X.Y.Z (release_version.py next)"
        type: string
        required: true
      previous:
        description: "Commit of the previous nightly (release notes since then); empty for the first"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build, rehearse signing without secrets, publish nothing"
        type: boolean
        required: false
        default: false

# Each job asks for what it needs, nothing more.
permissions: {}

env:
  # The commit being released (see above).
  REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: preflight
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Every signing secret is set (fails closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AIJ_UPDATER_PUBKEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          # Notarization: an App Store Connect API key (preferred), or an
          # Apple ID with an app-specific password.
          if [ -n "$APPLE_API_KEY$APPLE_API_KEY_ID$APPLE_API_ISSUER" ]; then
            for name in APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
              [ -n "${!name}" ] || missing+=("$name")
            done
            echo "Notarization: App Store Connect API key" >> "$GITHUB_STEP_SUMMARY"
          else
            for name in APPLE_ID APPLE_PASSWORD; do
              [ -n "${!name}" ] || missing+=("$name (or an App Store Connect API key)")
            done
            echo "Notarization: Apple ID and app-specific password" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not building — missing: ${missing[*]} (docs/RELEASING.md § One-time setup)"
            exit 1
          fi

  # Each architecture compiles on its own runner, at the same time (the
  # tauri-action, Zed and GitButler pattern); `build` joins them into the
  # universal app. One runner compiled both, one after the other, in
  # 24–26 minutes (ADR-0025).
  compile:
    name: compile ${{ matrix.edition }} ${{ matrix.arch }}
    needs: preflight
    # Runs after a passed preflight, or without one in a dry run.
    if: ${{ !cancelled() && (needs.preflight.result == 'success' || (inputs.dry_run && needs.preflight.result == 'skipped')) }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        edition: [main, nightly]
        arch: [aarch64-apple-darwin, x86_64-apple-darwin]
        include:
          - edition: main
            overlay: ""
            label: ""
          - edition: nightly
            overlay: crates/juggler-app/tauri.nightly.conf.json
            label: Nightly
    env:
      VERSION: ${{ inputs.version }}
      OVERLAY: ${{ matrix.overlay }}
      ARCH: ${{ matrix.arch }}
      # The release's pnpm: exact version and its npm sha512 (hex). To
      # update: `npm view pnpm@X.Y.Z dist.integrity`, base64 → hex.
      PNPM: pnpm@10.34.7+sha512.ba98abc585539933375b5971f4bc6d6c73a1b4b7edc4a879e7d102fe5423d1e02309d67c60a11f04955093a96e521ad9c3b138cdd654ca5be563f378b3ae48bd
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          fetch-depth: 0
          persist-credentials: false

      - name: Crates, exactly as locked
        # Every crate from the committed Cargo.lock, fetched fresh (no cache
        # is ever restored here), before the version stamp below edits the
        # manifests. The build then runs --offline: only our own crates'
        # stamped versions change in the lock, and nothing is downloaded.
        run: cargo fetch --locked

      - name: Version and notes
        env:
          PREVIOUS: ${{ inputs.previous }}
        run: |
          # The version is stamped into this checkout only (never committed).
          python3 scripts/release_version.py stamp "$VERSION"
          # Nightly notes from the commits since the previous nightly; a
          # version that already has hand-written notes keeps them.
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          # A database change since the previous nightly needs a downgrade
          # note (nightly_notes.py writes it; hand-written notes must too).
          ./scripts/release_notes_check.sh "$VERSION" ${PREVIOUS:+"$PREVIOUS"}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Toolchain (pinned)
        run: |
          rustup target add "$ARCH"
          # tauri-cli: Tauri's prebuilt release, checked against its digest.
          ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"
          # pnpm: this exact version, which corepack checks against its
          # sha512 (a mismatch stops the job). Activated as the default, so
          # tauri's `pnpm build` uses it too.
          corepack enable
          corepack prepare "$PNPM" --activate
          pnpm --version
          pnpm --dir ui install --frozen-lockfile

      - name: Icon
        # Generated from the brand PNG at build time; no generated binaries
        # live in the repository. AI Juggler Nightly's carries a "Nightly"
        # band (D-23). The compile embeds it (the window's icon) and the
        # bundle uses it, so `build` makes it the same way.
        env:
          LABEL: ${{ matrix.label }}
        run: |
          source=crates/juggler-app/icons/icon.png
          if [ -n "$LABEL" ]; then
            swift scripts/edition_icon.swift "$source" "$RUNNER_TEMP/edition.png" "$LABEL" 6D28D9
            source="$RUNNER_TEMP/edition.png"
          fi
          cargo tauri icon "$source" --output "$RUNNER_TEMP/icons"

      - name: The agent bridge, unsigned (this architecture)
        # AJ-E1704: `juggler-agent` ships beside the app's executable in
        # Contents/MacOS (Tauri's externalBin), so the sign job signs and
        # notarizes it with the app. Tauri looks for it by its target's name:
        # this architecture's build script wants juggler-agent-<arch>, and
        # `build` joins both into the universal one for the bundler.
        run: |
          set -euo pipefail
          arch="$ARCH"
          mkdir -p crates/juggler-app/binaries
          cargo build --release --offline -p juggler-agentbridge --bin juggler-agent --target "$arch"
          cp "target/$arch/release/juggler-agent" "crates/juggler-app/binaries/juggler-agent-$arch"

      - name: Compile the app, unsigned (this architecture)
        env:
          # Public: baked into the app as the key its updater verifies.
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          # `build` bundles with this very file (compiled-*/config-*.json),
          # so what is compiled in and the bundle agree.
          out="$RUNNER_TEMP/compiled" && mkdir -p "$out"
          python3 - > "$out/config-$ARCH.json" <<'PY'
          import json, os
          overlay = os.environ["OVERLAY"]
          config = json.load(open(overlay)) if overlay else {}
          config.pop("$schema", None)
          icons = os.environ["RUNNER_TEMP"] + "/icons"
          config["bundle"] = {
            "active": True,
            "targets": ["app"],
            # The updater archive is made from the signed, stapled app in
            # the sign job; nothing here can sign it.
            "createUpdaterArtifacts": False,
            # AJ-E1704: the agent bridge (binaries/juggler-agent-<target>).
            "externalBin": ["binaries/juggler-agent"],
            "icon": [icons + "/icon.icns", icons + "/icon.png"],
            # Apple Events for "jump to a session's window" (hardened
            # runtime): passed to codesign with the app's signature.
            "macOS": {"minimumSystemVersion": "14.0", "entitlements": "entitlements.plist"},
          }
          config["plugins"] = {"updater": {"pubkey": os.environ.get("AIJ_UPDATER_PUBKEY", ""), "requireSignedVersion": True}}
          print(json.dumps(config))
          PY
          # From the repository root, as `just app` does: that's where the
          # Tauri CLI finds the UI project (ui/) and runs `pnpm build` in it.
          cargo tauri build --target "$ARCH" --no-bundle --config "$out/config-$ARCH.json" -- --offline
          # A tar keeps the modes (an artifact wouldn't).
          tar -C "target/$ARCH/release" -cf "$out/$ARCH.tar" juggler-app juggler-agent
          tar -tvf "$out/$ARCH.tar"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compiled-${{ matrix.edition }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/compiled/
          retention-days: 1
          if-no-files-found: error

  # Joins the two architectures into the universal app and bundles it,
  # with the compile's own configuration. Nothing is compiled here.
  build:
    name: build ${{ matrix.edition }}
    needs: compile
    if: ${{ !cancelled() && needs.compile.result == 'success' }}
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            label: ""
          - edition: nightly
            label: Nightly
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      - name: Crates, exactly as locked
        # The bundler reads the workspace (cargo metadata); nothing compiles.
        run: cargo fetch --locked

      - name: Version
        # The bundle's Info.plist takes the version from the stamped config.
        run: python3 scripts/release_version.py stamp "$VERSION"

      - name: Toolchain (pinned)
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          # tauri-cli: Tauri's prebuilt release, checked against its digest.
          ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"

      - name: Icon
        # The compile's configuration names this folder ($RUNNER_TEMP/icons).
        env:
          LABEL: ${{ matrix.label }}
        run: |
          source=crates/juggler-app/icons/icon.png
          if [ -n "$LABEL" ]; then
            swift scripts/edition_icon.swift "$source" "$RUNNER_TEMP/edition.png" "$LABEL" 6D28D9
            source="$RUNNER_TEMP/edition.png"
          fi
          cargo tauri icon "$source" --output "$RUNNER_TEMP/icons"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: compiled-${{ matrix.edition }}-*
          path: ${{ runner.temp }}/compiled/
          merge-multiple: true

      - name: Bundle the universal app, unsigned
        run: |
          set -euo pipefail
          # Both architectures' executables, joined as `tauri build
          # --target universal-apple-darwin` joins them.
          universal=target/universal-apple-darwin/release
          mkdir -p "$universal" crates/juggler-app/binaries
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p "$RUNNER_TEMP/$arch"
            tar -C "$RUNNER_TEMP/$arch" -xf "$RUNNER_TEMP/compiled/$arch.tar"
          done
          lipo -create -output "$universal/juggler-app" \
            "$RUNNER_TEMP/aarch64-apple-darwin/juggler-app" "$RUNNER_TEMP/x86_64-apple-darwin/juggler-app"
          lipo -create -output crates/juggler-app/binaries/juggler-agent-universal-apple-darwin \
            "$RUNNER_TEMP/aarch64-apple-darwin/juggler-agent" "$RUNNER_TEMP/x86_64-apple-darwin/juggler-agent"
          lipo -info "$universal/juggler-app" crates/juggler-app/binaries/juggler-agent-universal-apple-darwin
          # The compile's configuration: both architectures had the same.
          config="$RUNNER_TEMP/compiled/config-aarch64-apple-darwin.json"
          cmp "$config" "$RUNNER_TEMP/compiled/config-x86_64-apple-darwin.json"
          cargo tauri bundle --target universal-apple-darwin --bundles app --config "$config"
          bundle="$universal/bundle/macos"
          out="$RUNNER_TEMP/unsigned" && mkdir -p "$out"
          # A tar keeps the bundle's modes and links (an artifact wouldn't).
          # The bridge is inside, beside the app's executable.
          test -x "$bundle"/*.app/Contents/MacOS/juggler-agent
          lipo -info "$bundle"/*.app/Contents/MacOS/*
          (cd "$bundle" && tar -cf "$out/app.tar" ./*.app)
          tar -tf "$out/app.tar" | sed -n 1,3p

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-${{ matrix.edition }}
          path: ${{ runner.temp }}/unsigned/
          retention-days: 3
          if-no-files-found: error

  sign:
    name: sign ${{ matrix.edition }}
    # Explicit status: a job skipped anywhere up the chain (preflight,
    # in a dry run) would otherwise skip this one too.
    if: ${{ !cancelled() && !inputs.dry_run && needs.build.result == 'success' }}
    needs: build
    runs-on: macos-latest
    # Apple's notary service can take most of an hour for a new team's
    # first submissions, and each edition waits for it twice (app, disk
    # image).
    timeout-minutes: 240
    # The release keys exist only here: the environment allows `main` only.
    environment: release
    # Read-only: the sparse checkout of the signing scripts.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            prefix: AI-Juggler
          - edition: nightly
            prefix: AI-Juggler-Nightly
    env:
      VERSION: ${{ inputs.version }}
      PREFIX: ${{ matrix.prefix }}
    steps:
      # The signing scripts only, from the commit being released.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign_macos.sh
            scripts/release_seams_check.sh
            scripts/apple_retry.py
            scripts/updater_sig_check.py
            scripts/install_tauri_cli.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ matrix.edition }}
          path: ${{ runner.temp }}/unsigned/

      - name: Pinned tauri-cli (for `signer sign`)
        run: ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"

      - name: Sign, notarize, staple; the updater archive; verify
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: ./scripts/sign_macos.sh "$RUNNER_TEMP/unsigned/app.tar" "$RUNNER_TEMP/assets"

      # The caller publishes these (nightly.yml).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.edition }}
          path: ${{ runner.temp }}/assets/
          retention-days: 7
          if-no-files-found: error

  sign-rehearsal:
    name: sign ${{ matrix.edition }} (rehearsal)
    # The dry run skips preflight; without an explicit status check that
    # skip would carry down and skip the rehearsal too.
    if: ${{ !cancelled() && inputs.dry_run && needs.build.result == 'success' }}
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30
    # No environment, no secret: an ad-hoc signature and a throwaway key.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            prefix: AI-Juggler
          - edition: nightly
            prefix: AI-Juggler-Nightly
    env:
      VERSION: ${{ inputs.version }}
      PREFIX: ${{ matrix.prefix }}
    steps:
      # The signing scripts only, from the commit being released.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
          sparse-checkout: |
            scripts/sign_macos.sh
            scripts/release_seams_check.sh
            scripts/apple_retry.py
            scripts/updater_sig_check.py
            scripts/install_tauri_cli.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ matrix.edition }}
          path: ${{ runner.temp }}/unsigned/

      - name: Pinned tauri-cli (for `signer sign`)
        run: ./scripts/install_tauri_cli.sh "$RUNNER_TEMP/tauri-cli" >> "$GITHUB_PATH"

      - name: Rehearse signing (no secrets)
        env:
          REHEARSAL: "1"
        run: ./scripts/sign_macos.sh "$RUNNER_TEMP/unsigned/app.tar" "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rehearsal-${{ matrix.edition }}
          path: ${{ runner.temp }}/assets/
          retention-days: 3
          if-no-files-found: error
