# D-20: build, sign and notarize one AI Juggler version, and publish it
# as a pre-release with its update feeds: `latest.json` (AI Juggler) and
# `latest-nightly.json` (AI Juggler Nightly, D-23). Called by
# nightly.yml; promote.yml later points the beta and stable channels at
# the same build. Nothing is ever rebuilt for a channel.
#
# The two editions build in parallel jobs, from the same commit; one
# publish job then puts both on one release. Each app is notarized and
# stapled, and so is its disk image, so Gatekeeper opens the download
# without a warning, online or off.
#
# Fails closed: without every signing secret nothing is built. No build
# cache is restored: a signed, notarized build starts from a clean runner
# so nothing another workflow wrote can end up inside it.
name: Build (macOS)

on:
  workflow_call:
    inputs:
      ref:
        description: "Commit to build"
        type: string
        required: true
      version:
        description: "X.Y.Z (release_version.py next)"
        type: string
        required: true
      previous:
        description: "Commit of the previous nightly (release notes since then); empty for the first"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  edition:
    name: build ${{ matrix.edition }}
    runs-on: macos-latest
    # Apple's notary service can take most of an hour for a new team's
    # first submissions, and each edition waits for it twice (app, disk
    # image).
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: main
            prefix: AI-Juggler
            overlay: ""
            label: ""
          - edition: nightly
            prefix: AI-Juggler-Nightly
            overlay: crates/juggler-app/tauri.nightly.conf.json
            label: Nightly
    env:
      VERSION: ${{ inputs.version }}
      EDITION: ${{ matrix.edition }}
      PREFIX: ${{ matrix.prefix }}
      OVERLAY: ${{ matrix.overlay }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Preflight — secrets, version, notes (fails closed)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD AIJ_UPDATER_PUBKEY; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not building — missing: ${missing[*]} (docs/RELEASING.md § One-time setup)"
            exit 1
          fi
          # The version is stamped into this checkout only (never committed).
          python3 scripts/release_version.py stamp "$VERSION"
          # Nightly notes from the commits since the previous nightly; a
          # version that already has hand-written notes keeps them.
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          ./scripts/release_notes_check.sh "$VERSION"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Toolchain
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked
          corepack enable
          pnpm --dir ui install --frozen-lockfile

      - name: Icon
        # Generated from the brand PNG at build time; no generated binaries
        # live in the repository. AI Juggler Nightly's carries a "Nightly"
        # band (D-23).
        env:
          LABEL: ${{ matrix.label }}
        run: |
          source=crates/juggler-app/icons/icon.png
          if [ -n "$LABEL" ]; then
            swift scripts/edition_icon.swift "$source" "$RUNNER_TEMP/edition.png" "$LABEL" 6D28D9
            source="$RUNNER_TEMP/edition.png"
          fi
          cargo tauri icon "$source" --output "$RUNNER_TEMP/icons"

      - name: Build, sign and notarize the app (universal)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Baked into the app: the key its updater verifies against.
          AIJ_UPDATER_PUBKEY: ${{ vars.AIJ_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          config=$(python3 - <<'PY'
          import json, os
          overlay = os.environ["OVERLAY"]
          config = json.load(open(overlay)) if overlay else {}
          config.pop("$schema", None)
          icons = os.environ["RUNNER_TEMP"] + "/icons"
          config["bundle"] = {
            "active": True,
            "targets": ["app", "dmg"],
            "createUpdaterArtifacts": True,
            "icon": [icons + "/icon.icns", icons + "/icon.png"],
            "macOS": {"minimumSystemVersion": "14.0"},
          }
          config["plugins"] = {"updater": {"pubkey": os.environ["AIJ_UPDATER_PUBKEY"], "requireSignedVersion": True}}
          print(json.dumps(config))
          PY
          )
          # From the repository root, as `just app` does: that's where the
          # Tauri CLI finds the UI project (ui/) and runs `pnpm build` in it.
          # Signing reaches Apple's timestamp and notary services; a blip
          # there is retried, any other failure stops the build at once.
          python3 scripts/apple_retry.py -- cargo tauri build --target universal-apple-darwin --config "$config"

      - name: Notarize and staple the disk image
        # Tauri notarizes and staples the app; the .dmg around it is
        # signed but not notarized, so it gets its own ticket here.
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          python3 scripts/apple_retry.py -- xcrun notarytool submit "$dmg" \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 90m
          # A fresh ticket can take a moment to reach Apple's CDN.
          python3 scripts/apple_retry.py -- xcrun stapler staple "$dmg"

      - name: Verify the signatures, notarization and updater signature
        run: |
          set -euo pipefail
          bundle=target/universal-apple-darwin/release/bundle
          app="$(ls -d "$bundle"/macos/*.app | head -1)"
          dmg="$(ls "$bundle"/dmg/*.dmg | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          python3 scripts/apple_retry.py -- spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          python3 scripts/apple_retry.py -- spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          ls "$bundle"/macos/*.app.tar.gz "$bundle"/macos/*.app.tar.gz.sig

      - name: Collect this edition's assets
        run: |
          bundle=target/universal-apple-darwin/release/bundle
          out="$RUNNER_TEMP/assets" && mkdir -p "$out"
          cp "$(ls "$bundle"/dmg/*.dmg | head -1)" "$out/${PREFIX}-${VERSION}-universal.dmg"
          cp "$(ls "$bundle"/macos/*.app.tar.gz | head -1)" "$out/${PREFIX}-${VERSION}-universal.app.tar.gz"
          cp "$(ls "$bundle"/macos/*.app.tar.gz.sig | head -1)" "$out/${PREFIX}-${VERSION}-universal.app.tar.gz.sig"
          ls -l "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.edition }}
          path: ${{ runner.temp }}/assets/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: publish
    needs: edition
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/assets/
          merge-multiple: true

      - name: Release notes (as the build jobs wrote them)
        env:
          PREVIOUS: ${{ inputs.previous }}
          REF: ${{ inputs.ref }}
        run: |
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          ./scripts/release_notes_check.sh "$VERSION"

      - name: Assemble the update feeds and checksums
        run: |
          python3 - <<PY
          import json, os, datetime
          version = os.environ["VERSION"]
          out = os.environ["RUNNER_TEMP"] + "/assets"
          notes = open(f"docs/releases/{version}.md").read()
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # latest.json: AI Juggler (what beta and stable point at later).
          # latest-nightly.json: AI Juggler Nightly (the nightly feed).
          for feed_name, prefix in (("latest.json", "AI-Juggler"), ("latest-nightly.json", "AI-Juggler-Nightly")):
              archive = f"{prefix}-{version}-universal.app.tar.gz"
              sig = open(f"{out}/{archive}.sig").read().strip()
              url = f"https://github.com/${{ github.repository }}/releases/download/v{version}/{archive}"
              feed = {
                "version": version,
                "notes": notes,
                "pub_date": date,
                "platforms": {p: {"signature": sig, "url": url} for p in ("darwin-aarch64", "darwin-x86_64")},
              }
              json.dump(feed, open(f"{out}/{feed_name}", "w"), indent=2)
          PY
          (cd "$RUNNER_TEMP/assets" && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the build (pre-release; channels point at it later)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          gh release create "v${VERSION}" "$RUNNER_TEMP"/assets/* \
            --repo "${{ github.repository }}" \
            --target "$REF" \
            --prerelease \
            --title "${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"
