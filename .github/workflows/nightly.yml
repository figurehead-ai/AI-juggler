# D-20: the nightly channel — built from main every day, no approval.
# Its feed carries AI Juggler Nightly, installed next to AI Juggler (D-23).
# Skips a day with no new commits. Every build gets the next version
# (MAJOR.MINOR from Cargo.toml, PATCH = this workflow's run number), is
# published as a pre-release, and becomes the nightly feed. Promotion to
# beta and stable (promote.yml) reuses the same signed build.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main hasn't changed since the last nightly"
        type: boolean
        default: false

# Each job asks for what it needs (AJ-E2001): only the jobs that publish
# may write to the repository.
permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: What to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
          RUN: ${{ github.run_number }}
        run: |
          ref="$(git rev-parse HEAD)"
          previous=""
          work="$RUNNER_TEMP/feed" && mkdir -p "$work"
          if gh release download nightly-channel --repo "$REPO" --pattern latest.json --dir "$work" 2>/dev/null; then
            last="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$work/latest.json")"
            previous="$(gh release view "v$last" --repo "$REPO" --json targetCommitish --jq .targetCommitish)"
          fi
          skip=false
          if [ "$previous" = "$ref" ] && [ "$FORCE" != "true" ]; then
            skip=true
            echo "main hasn't changed since the last nightly ($ref)." >> "$GITHUB_STEP_SUMMARY"
          fi
          version="$(python3 scripts/release_version.py next "$RUN")"
          {
            echo "skip=$skip"
            echo "version=$version"
            echo "ref=$ref"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly $version from $ref (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # The ceiling for the called workflow: its build and sign jobs read,
    # only its publish job writes.
    permissions:
      contents: write
    uses: ./.github/workflows/build-macos.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      version: ${{ needs.plan.outputs.version }}
      previous: ${{ needs.plan.outputs.previous }}
    # The signing secrets live in the `release` environment, which only
    # build-macos.yml's preflight and sign jobs enter. Until the maintainer
    # moves them there (docs/RELEASING.md), they come from the repository
    # through this line, and still only those two jobs read them.
    secrets: inherit

  publish:
    name: nightly feed
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the nightly channel at this build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/channel" && mkdir -p "$work" && cd "$work"
          # D-23: the nightly feed carries AI Juggler Nightly, a separate
          # app; AI Juggler itself only ever follows beta or stable.
          gh release download "v$VERSION" --repo "$REPO" --pattern latest-nightly.json
          mv latest-nightly.json latest.json
          python3 -c 'import json; d=json.load(open("latest.json")); assert d["version"] and d["platforms"], "bad feed"; assert all("AI-Juggler-Nightly-" in p["url"] for p in d["platforms"].values()), "not the Nightly app"'
          if ! gh release view nightly-channel --repo "$REPO" >/dev/null 2>&1; then
            gh release create nightly-channel --repo "$REPO" --prerelease \
              --title "Nightly channel (update feed)" \
              --notes "The update feed nightly installs read. Not a release: download a version from the list above."
          fi
          gh release upload nightly-channel latest.json --repo "$REPO" --clobber
          echo "Nightly channel → $VERSION" >> "$GITHUB_STEP_SUMMARY"
