# D-20: the nightly channel — built from main every day, no approval.
# Its feed carries AI Juggler Nightly, installed next to AI Juggler (D-23).
# The scheduled run skips a day when nothing that ships changed since the
# newest release tag (scripts/release_ships.py), so a docs- or tests-only
# day takes no version number. A run started by hand builds whatever
# changed; only the very commit of the last nightly needs `force`. Every
# build gets the next version (MAJOR.MINOR from Cargo.toml; PATCH 0 for a
# new MAJOR.MINOR, else one past the last release tag:
# scripts/release_version.py), is published as a pre-release, and becomes
# the nightly feed. Promotion to beta and stable (promote.yml) reuses the
# same signed build.
name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if main hasn't changed since the last nightly"
        type: boolean
        default: false

# Each job asks for what it needs (AJ-E2001): only the jobs that publish
# may write to the repository.
permissions: {}

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - name: From main only
        # build-macos.yml builds the commit this run started on, so a run
        # started on any other branch would publish that branch.
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          if [ "$RUN_REF" != "refs/heads/main" ]; then
            echo "::error::The nightly is built from main only (this run is on $RUN_REF)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: What to build
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || false }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ref="$(git rev-parse HEAD)"
          previous=""
          work="$RUNNER_TEMP/feed" && mkdir -p "$work"
          if gh release download nightly-channel --repo "$REPO" --pattern latest.json --dir "$work" 2>/dev/null; then
            last="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$work/latest.json")"
            # A version taken back (v0.1.18, 2026-10-24) has no release: then
            # there is no previous build to compare with.
            previous="$(gh release view "v$last" --repo "$REPO" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
          fi
          # What ships (scripts/release_ships.py, the only list): the files
          # that differ from the newest release tag, renames as both paths.
          newest="$(git tag -l 'v*' | python3 scripts/release_ships.py newest)"
          changed="" shipping=""
          if [ -n "$newest" ]; then
            changed="$(git diff --no-renames --name-only "$newest" "$ref")"
            shipping="$(printf '%s\n' "$changed" | python3 scripts/release_ships.py filter)"
          fi
          files() {
            n="$(printf '%s' "$1" | grep -c . || true)"
            if [ "$n" = 1 ]; then echo "1 file"; else echo "$n files"; fi
          }
          skip=false
          if [ "$EVENT" = "schedule" ] && [ -n "$newest" ] && [ -z "$shipping" ]; then
            # The scheduled run only: a build identical to $newest would
            # take the number the next real release needs (v0.1.5, v0.1.7).
            skip=true
            if [ -z "$changed" ]; then
              echo "No nightly today: main is still $newest's commit." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No nightly today: nothing that ships changed since $newest ($(files "$changed") changed, none of them in the app or its build). Run Nightly by hand to build anyway." >> "$GITHUB_STEP_SUMMARY"
            fi
          elif [ "$previous" = "$ref" ] && [ "$FORCE" != "true" ]; then
            skip=true
            echo "main hasn't changed since the last nightly ($ref)." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$newest" ] && [ -z "$shipping" ]; then
            echo "Built by hand: nothing that ships changed since $newest." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$newest" ]; then
            echo "Changed since $newest: $(files "$changed"), $(printf '%s' "$shipping" | grep -c . || true) of them in the app or its build." >> "$GITHUB_STEP_SUMMARY"
          fi
          # The checkout above has every tag (fetch-depth: 0).
          version="$(git tag -l 'v*' | python3 scripts/release_version.py next)"
          {
            echo "skip=$skip"
            echo "version=$version"
            echo "ref=$ref"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          if [ "$skip" != "true" ]; then
            echo "Nightly $version from $ref (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    # The called workflow only reads; publishing happens in `release`.
    permissions:
      contents: read
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      previous: ${{ needs.plan.outputs.previous }}
    # The signing secrets live in the `release` environment, which only
    # build-macos.yml's preflight and sign jobs enter. Until the maintainer
    # moves them there (docs/RELEASING.md), they come from the repository
    # through this line, and still only those two jobs read them.
    secrets: inherit

  release:
    name: publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    # With the feed job below, the only jobs that may write to the
    # repository (AJ-E2001); this one runs no build code.
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: ${{ runner.temp }}/assets/
          merge-multiple: true

      - name: Release notes (as the build jobs wrote them)
        env:
          PREVIOUS: ${{ needs.plan.outputs.previous }}
          REF: ${{ needs.plan.outputs.ref }}
        run: |
          if [ ! -f "docs/releases/${VERSION}.md" ]; then
            python3 scripts/nightly_notes.py "$VERSION" "$PREVIOUS" "$REF"
          fi
          # A database change since the previous nightly needs a downgrade
          # note (nightly_notes.py writes it; hand-written notes must too).
          ./scripts/release_notes_check.sh "$VERSION" ${PREVIOUS:+"$PREVIOUS"}

      - name: Assemble the update feeds and checksums
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          version = os.environ["VERSION"]
          repository = os.environ["REPOSITORY"]
          out = os.environ["RUNNER_TEMP"] + "/assets"
          notes = open(f"docs/releases/{version}.md").read()
          date = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          # latest.json: AI Juggler (what beta and stable point at later).
          # latest-nightly.json: AI Juggler Nightly (the nightly feed).
          for feed_name, prefix in (("latest.json", "AI-Juggler"), ("latest-nightly.json", "AI-Juggler-Nightly")):
              archive = f"{prefix}-{version}-universal.app.tar.gz"
              sig = open(f"{out}/{archive}.sig").read().strip()
              url = f"https://github.com/{repository}/releases/download/v{version}/{archive}"
              feed = {
                "version": version,
                "notes": notes,
                "pub_date": date,
                "platforms": {p: {"signature": sig, "url": url} for p in ("darwin-aarch64", "darwin-x86_64")},
              }
              json.dump(feed, open(f"{out}/{feed_name}", "w"), indent=2)
          PY
          (cd "$RUNNER_TEMP/assets" && sha256sum ./* > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish the build (pre-release; channels point at it later)
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ needs.plan.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release create "v${VERSION}" "$RUNNER_TEMP"/assets/* \
            --repo "$REPOSITORY" \
            --target "$REF" \
            --prerelease \
            --title "${VERSION}" \
            --notes-file "docs/releases/${VERSION}.md"

  publish:
    name: nightly feed
    needs: [plan, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Point the nightly channel at this build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/channel" && mkdir -p "$work" && cd "$work"
          # D-23: the nightly feed carries AI Juggler Nightly, a separate
          # app; AI Juggler itself only ever follows beta or stable.
          gh release download "v$VERSION" --repo "$REPO" --pattern latest-nightly.json
          mv latest-nightly.json latest.json
          python3 -c 'import json; d=json.load(open("latest.json")); assert d["version"] and d["platforms"], "bad feed"; assert all("AI-Juggler-Nightly-" in p["url"] for p in d["platforms"].values()), "not the Nightly app"'
          if ! gh release view nightly-channel --repo "$REPO" >/dev/null 2>&1; then
            gh release create nightly-channel --repo "$REPO" --prerelease \
              --title "Nightly channel (update feed)" \
              --notes "The update feed nightly installs read. Not a release: download a version from the list above."
          fi
          gh release upload nightly-channel latest.json --repo "$REPO" --clobber
          echo "Nightly channel → $VERSION" >> "$GITHUB_STEP_SUMMARY"
