name: CI

# ADR-0025: every gate runs here, split across GitHub's standard runners
# (free for a public repository; larger runners are billed, so none is
# used). The required checks keep their names: `verify` and `visual` (and
# `a11y`) are jobs that need their parts and fail unless every part passed,
# so the ruleset's required checks (verify, ui, visual, build-macos,
# build-linux, build-windows) apply unchanged. `verify` also needs every
# other gate (a11y included), so a short run (a job skipped, cancelled or
# never started) can't leave it green. No job retries a test.

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: main and the release/* branches
  # (one PR per release), so the Linux and Windows jobs see release/*
  # code before it merges.
  pull_request:
  # Once a week every job runs on main whatever the push skipped (below),
  # and main's build caches are saved afresh.
  schedule:
    - cron: "41 5 * * 1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # A full run: every gate must run and pass, none may be skipped as
  # unaffected. Every push and weekly run, every pull request into main
  # or a release/* branch, and every release/* pull request. Worked out
  # from the event itself, not from `plan`, so the jobs that judge the
  # run (verify, visual, a11y) don't trust the job they judge.
  FULL: ${{ github.event_name != 'pull_request' || github.base_ref == github.event.repository.default_branch || startsWith(github.base_ref, 'release/') || startsWith(github.head_ref, 'release/') }}

# The token reads only (CodeQL actions/missing-workflow-permissions): the
# visual job reads the PR's body; a job needing more says so itself.
permissions:
  contents: read
  pull-requests: read

jobs:
  # What this run has to do. A push to main whose tree is exactly the
  # tree its pull request's head passed every required check with runs
  # nothing again (`tested`): the merge commit (or squash) of an up-to-date
  # PR carries the same content, so the same gates would give the same
  # answers. Anything else, and the weekly run, runs every job.
  plan:
    name: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      tested: ${{ steps.same.outputs.tested }}
      visual: ${{ steps.scope.outputs.visual }}
      a11y: ${{ steps.scope.outputs.a11y }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # A full run (FULL, above) runs both UI gates whatever changed. Only
      # a pull request into another branch may skip them, and only by
      # comparing with its base branch (never with the previous push): the
      # visual gate on changes to the UI or to this workflow, the
      # accessibility gate (AJ-E804) on changes to the UI, its scripts or
      # this workflow. `verify`, `visual` and `a11y` fail a full run whose
      # gates didn't all run and pass.
      - name: Did this change touch the UI?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          visual=true a11y=true
          if [ "$FULL" != true ] && [ -n "$BASE" ] \
            && git fetch -q --no-tags --depth=1 origin "$BASE"; then
            changed="$(git diff --name-only "$BASE" HEAD)"
            grep -qE '^ui/|^\.github/workflows/ci\.yml$|^scripts/visual_summary\.py$' <<<"$changed" || visual=false
            grep -qE '^ui/|^scripts/(a11y_gate\.sh|axe_summary\.py)$|^\.github/workflows/ci\.yml$' <<<"$changed" || a11y=false
          fi
          echo "visual=$visual" >> "$GITHUB_OUTPUT"
          echo "a11y=$a11y" >> "$GITHUB_OUTPUT"
          echo "UI gates: visual $visual, accessibility $a11y" >> "$GITHUB_STEP_SUMMARY"
      - name: Already tested? (a push to main with its pull request's tree)
        id: same
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SHA\")][0] // empty | \"\(.number) \(.head.sha)\"")"
          if [ -z "$pr" ]; then
            echo "No pull request merged as $SHA: every job runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          number="${pr% *}" head="${pr#* }"
          git fetch -q --no-tags --depth=1 origin "refs/pull/$number/head"
          if [ "$(git rev-parse FETCH_HEAD)" != "$head" ] \
            || [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "#$number's head ($head) has another tree than $SHA: every job runs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh api --paginate "repos/$REPO/commits/$head/check-runs?per_page=100" \
            --jq '.check_runs[] | {name, status, conclusion, completed_at, app: .app.slug}' > "$RUNNER_TEMP/runs.jsonl"
          if python3 scripts/gate_passed.py checks "$RUNNER_TEMP/runs.jsonl" \
            verify ui visual a11y build-macos build-linux build-windows; then
            echo "tested=$head" >> "$GITHUB_OUTPUT"
            echo "Same tree as #$number's head ($head), which passed every required check: nothing runs again." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "#$number's head has the same tree but not every required check passed there: every job runs." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The checks that run no test, cheapest first, stopping at the first
  # failure: the release notes, the project's lints, fmt, clippy (three
  # variants), rustdoc, cargo-deny. `just verify-static` locally.
  static:
    name: static
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The release-notes check compares the schema with older tags.
          fetch-depth: 0
          persist-credentials: false
      - name: Release notes this change touched (as the nightly checks them)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            ./scripts/release_notes_changed.sh "$BASE"
          fi
      - name: Evidence store (AJ-E801 gate)
        run: ./scripts/evidence_check.sh
      - name: A design critique beside every gallery family's captures (AJ-E2814, D-57)
        run: |
          python3 scripts/critique_check.py --selftest
          python3 scripts/critique_check.py
      - name: Terminology and plain words (AJ-E108, AJ-E1535 gates)
        run: |
          ./scripts/terminology_lint.sh
          python3 scripts/plain_words_lint.py --selftest
          python3 scripts/plain_words_lint.py
      - name: No real person's data in the public repository (D-101)
        run: |
          python3 scripts/private_data_lint.py --selftest
          python3 scripts/private_data_lint.py
          python3 scripts/hooks/private_terms.py --selftest
          python3 scripts/qa/anonymize.py --selftest
          python3 scripts/qa/presence_check.py --selftest
      - name: Every link in the public docs resolves (the 0.1 checklist, 8.8)
        run: python3 scripts/docs_links_check.py
      - name: AI Juggler's own helpers start with only what they need (AJ-E2010)
        run: |
          python3 scripts/spawn_lint.py --selftest
          python3 scripts/spawn_lint.py
      - name: An Account's record is never printed (CodeQL rust/cleartext-logging)
        run: |
          python3 scripts/cleartext_lint.py --selftest
          python3 scripts/cleartext_lint.py
      - name: ARCHITECTURE.md is current and every crate says what it must not know (AJ-E2015)
        run: |
          python3 scripts/architecture_fresh.py --selftest
          python3 scripts/architecture_fresh.py
      - name: The web views stay narrow (AJ-E2003)
        run: |
          python3 scripts/webview_lint.py --selftest
          python3 scripts/webview_lint.py
      - name: No tool-id literal outside the adapters (AJ-E1525, ADR-0019)
        run: |
          python3 scripts/tool_literal_lint.py --selftest
          python3 scripts/tool_literal_lint.py
      - name: No new macOS- or Unix-only assumption outside the platform seams
        run: |
          python3 scripts/platform_lint.py --selftest
          python3 scripts/platform_lint.py
      - name: The keychain only through its one door (a lab never reaches it)
        run: |
          python3 scripts/keychain_lint.py --selftest
          python3 scripts/keychain_lint.py
      - name: Layering, IPC audit, size budget and machine reads (AJ-E2011)
        run: |
          python3 scripts/check_layering.py --selftest
          python3 scripts/check_layering.py
          python3 scripts/ipc_audit.py --selftest
          python3 scripts/ipc_audit.py
          python3 scripts/size_budget.py --selftest
          python3 scripts/size_budget.py
          python3 scripts/allow_reasons.py --selftest
          python3 scripts/allow_reasons.py
          python3 scripts/machine_state_lint.py --selftest
          python3 scripts/machine_state_lint.py
      - name: Task counts and ranges in the docs match the epic files
        run: |
          python3 scripts/check_task_counts.py --selftest
          python3 scripts/check_task_counts.py
      - name: Usage-statistics doc is generated from the schema (AJ-E1106)
        run: python3 scripts/gen_usage_stats_doc.py --check
      - name: Every sub-second timer says why (AJ-E805)
        run: python3 scripts/polling_audit.py > /dev/null
      - name: Release and CI scripts (D-20, D-24, ADR-0025 self-tests)
        run: |
          python3 scripts/gate_passed.py --selftest
          python3 scripts/affected_crates.py --selftest
          python3 scripts/release_version.py --selftest
          python3 scripts/release_ships.py --selftest
          python3 scripts/nightly_notes.py --selftest
          python3 scripts/downgrade_note.py --selftest
          python3 scripts/promotion_rules.py --selftest
          python3 scripts/stats_config_check.py --selftest
          python3 scripts/release_scope.py --selftest
          python3 scripts/release_scope.py report 0.4 >/dev/null
          python3 scripts/apple_retry.py --selftest
          python3 scripts/updater_sig_check.py --selftest
      - name: Tool capabilities manifest
        run: python3 scripts/capabilities.py check
      - name: The live labs' snapshot runs in the C locale
        run: LC_ALL=en_US.UTF-8 ./scripts/qa/runtime_lab_snapshot.sh selftest
      - name: The local gate runs what CI's verify runs (`just verify`)
        run: |
          python3 scripts/ci_parity.py --selftest
          python3 scripts/ci_parity.py
      - name: Format
        run: cargo fmt --all --check
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-static-cargo-lt-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-static-cargo-lt-
      - name: The fuzz build holds no Tauri or GTK (AJ-E2008)
        run: |
          python3 scripts/fuzz_light.py --selftest
          python3 scripts/fuzz_light.py
      - name: Install cargo-deny (release binary)
        env:
          DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          deny="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${deny}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${deny}.tar.gz.sha256"
          echo "$(cut -d' ' -f1 "${deny}.tar.gz.sha256")  ${deny}.tar.gz" | sha256sum -c -
          tar -xzf "${deny}.tar.gz"
          mv "${deny}/cargo-deny" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Clippy (the test bridge with its lab write mode; docs/qa/DEV-BRIDGE.md, ADR-0027)
        run: cargo clippy -p juggler-app --all-targets --features lab-bridge -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Usage-statistics types are generated from the schema; the stats feature leaves them out (AJ-E1102)
        run: |
          python3 scripts/gen_stats_events.py --check
          ./scripts/stats_feature_check.sh
      - name: Dependency policy (cargo-deny)
        run: cargo deny check
      - name: cargo-vet and cargo-machete (pinned, digest-checked)
        run: |
          ./scripts/install_release_tool.sh cargo-vet "$HOME/.local/bin" >/dev/null
          ./scripts/install_release_tool.sh cargo-machete "$HOME/.local/bin" >/dev/null
      - name: No unused Rust dependency (cargo-machete, AJ-E2011 R7)
        run: cargo machete
      - name: Every dependency audited or exempted; exemptions only shrink (cargo-vet, AJ-E2007 R1)
        env:
          BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: |
          cargo vet --locked
          python3 scripts/vet_exemptions.py --selftest
          python3 scripts/vet_exemptions.py
          python3 scripts/js_sbom.py --selftest
      - name: Save the Cargo cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # Report only (D-99): a release's scope is open while it is built and
      # tried on nightly and beta; only the Stable promotion fails on it
      # (promote.yml).
      - name: What of the release's roadmap scope is still open (release_scope.py, report only)
        if: ${{ !cancelled() && github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/') }}
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/release_scope.py report "${HEAD_REF#release/}"

  # The test binaries, built once (cargo-nextest's archive) for the
  # partitions below, which wait for this whole job: nothing else runs here.
  rust-build:
    name: tests (build)
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # No debug info: a failing test still names its file and line (the
      # panic carries them), and the archive every partition downloads is
      # a fraction of the size (5.4 GB with line tables, 2026-11-02). Full
      # debug info once took about 100 GB (#198). The runner has room
      # (88 GB free on 2026-11-02), so no SDK is removed first.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # The dependencies of the test build ("-d0": no debug info, above).
      # Only theirs: the workspace's own crates rebuild on every checkout
      # anyway (new files), so they are left out before saving.
      - name: Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-tests-cargo-d0-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-tests-cargo-d0-
      - name: Install cargo-nextest (release binary, checked)
        env:
          NEXTEST: cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
          NEXTEST_URL: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$NEXTEST" "$NEXTEST_URL/$NEXTEST"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/$NEXTEST" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$NEXTEST" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build every test binary once
        run: cargo nextest archive --workspace --archive-file "$RUNNER_TEMP/nextest.tar.zst"
      - name: The generated TypeScript types match the Rust (AJ-E2011)
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --workspace-remap . -E 'test(/export_bindings/)' --no-tests=warn
          ./scripts/ts_types_fresh.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      # Swatinem/rust-cache's rule, by hand (GitHub-owned actions only): the
      # workspace's own artifacts and the test binaries out, the
      # dependencies in (a 6 GB cache took 4 minutes to restore).
      - name: Keep the dependencies only
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf target/debug/incremental target/nextest
          find target/debug -maxdepth 1 -type f -delete
          find target/debug/deps -maxdepth 1 -type f -perm -u+x ! -name '*.so' -delete
          find target/debug/deps target/debug/.fingerprint target/debug/build -maxdepth 1 -name '*juggler*' -exec rm -rf {} +
          du -sh target
      - name: Save the Cargo cache (the dependencies)
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Room left on the runner
        shell: bash
        run: |
          free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free after the test build: ${free} GB"
          if [ "$free" -lt 10 ]; then
            echo "::warning::Only ${free} GB free after the test build (#198 ran out)."
          fi

  # Every test, in six slices of the one build (nextest's `slice`: the
  # tests dealt out in turn, so a serial group spreads over all six; `hash`
  # left one partition with twice the others' work). A process per test;
  # .config/nextest.toml keeps the ones that share a resource or time the
  # clock apart, and never retries.
  rust-test:
    name: tests (${{ matrix.partition }}/6)
    needs: [plan, rust-build]
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    steps:
      # The same path as the build's checkout: the tests reach their
      # fixtures through the paths they were compiled with.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install cargo-nextest (release binary, checked)
        env:
          NEXTEST: cargo-nextest-0.9.146-x86_64-unknown-linux-gnu.tar.gz
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
          NEXTEST_URL: https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSLo "$RUNNER_TEMP/$NEXTEST" "$NEXTEST_URL/$NEXTEST"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/$NEXTEST" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$NEXTEST" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Some tests read the dependency graph (`cargo metadata --offline`,
      # trust.rs): the crates, as locked, without building them.
      - name: Crates, exactly as locked
        run: cargo fetch --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      # The archive unpacks into target/ here, where the build had it.
      # --no-fail-fast: every failing test in one run (#198 took four runs
      # to show four problems).
      - name: Tests, partition ${{ matrix.partition }} of 6 (no retries)
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          mkdir -p target/tmp
          cargo-nextest nextest run --archive-file "$RUNNER_TEMP/nextest.tar.zst" --workspace-remap . --extract-to . --extract-overwrite --partition "slice:$PARTITION/6" --profile ci --no-fail-fast
          ./scripts/leaked_fixtures.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: junit-tests-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  # The doctests (nextest doesn't run them), the read-only test bridge's
  # tests, and the proof it never ships (docs/qa/DEV-BRIDGE.md): beside
  # the test build, so the partitions don't wait for them.
  dev-bridge:
    name: doctests, dev-bridge
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # As the test build, whose cache this job reads.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      # The test build's cache (its dependencies are this build's), read only.
      - name: Cargo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-tests-cargo-d0-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-tests-cargo-d0-
      - name: Doctests
        run: cargo test --workspace --doc
      - name: Test bridge's tests, read-only and with the lab write mode (Dev builds only)
        run: |
          cargo test -p juggler-app --features dev-bridge --lib dev_bridge
          cargo test -p juggler-app --features lab-bridge --lib dev_bridge
      - name: The bridge never ships
        run: ./scripts/dev_bridge_check.sh
      - name: The Floor's harness and test input (AJ-E3514), tested and never shipped
        run: |
          cargo test -p juggler-app --features floor-harness --lib floor::drive
          ./scripts/floor_harness_check.sh

  # AJ-E3513: the Floor's gallery of golden frames, drawn offscreen on
  # software Vulkan (lavapipe) in the visual gate's pinned image, so a
  # local run in the same image draws the same frames. A frame that
  # changed more than the tolerance fails; every frame is uploaded, to be
  # looked at and, once approved, committed as the new baseline
  # (crates/juggler-floor-render/tests/golden/).
  floor-gallery:
    name: floor-gallery
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Software Vulkan and Rust
        timeout-minutes: 28
        run: |
          # Bounded and retried (#218: runs 42761209113 and 43035537210
          # lost the mirrors; scripts/ci/apt_install.sh says how).
          ./scripts/ci/apt_install.sh mesa-vulkan-drivers libvulkan1 build-essential pkg-config curl ca-certificates
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: The gallery against its baselines
        env:
          AJ_DUMP_GOLDEN: ${{ github.workspace }}/floor-gallery
        run: cargo test -p juggler-floor-render --test golden
      - name: The frames, to look at
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: floor-gallery
          path: floor-gallery/
          if-no-files-found: ignore
          retention-days: 14

  # The required check `verify`: every part of the Rust gate passed, and
  # on a full run every gate of this workflow ran and passed, so `verify`
  # alone is all green (`a11y` isn't a required check of its own). Any
  # result but success fails it: failure, cancelled, skipped, and a job
  # GitHub never started (`abandoned`, run 42671881211 in an Actions
  # outage). Only a pull request outside FULL may skip the UI gates, when
  # plan found no UI change. A run that never creates `verify` leaves the
  # required check missing, which blocks the merge.
  verify:
    name: verify
    needs: [plan, static, rust-build, rust-test, dev-bridge, floor-gallery, ui, visual-shard, visual, a11y-shard, a11y, build-macos, rc-dev-app, build-linux, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          TESTED: ${{ needs.plan.outputs.tested }}
          VISUAL: ${{ needs.plan.outputs.visual }}
          A11Y: ${{ needs.plan.outputs.a11y }}
        run: |
          set -euo pipefail
          [ "$(jq -r .plan.result <<<"$NEEDS")" = success ] || { echo "::error::plan didn't pass"; exit 1; }
          if [ -n "$TESTED" ]; then
            echo "verify: passed on $TESTED, the same tree (see plan)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$FULL" = true ] && { [ "$VISUAL" != true ] || [ "$A11Y" != true ]; }; then
            echo "::error::verify: a full run must run every UI gate, but plan set visual=$VISUAL, a11y=$A11Y"
            exit 1
          fi
          # Outside a full run, a UI gate plan scoped out may be skipped.
          may_skip="$(jq -nc --arg v "$VISUAL" --arg a "$A11Y" --arg full "$FULL" \
            'if $full == "true" then [] else
               (if $v != "true" then ["visual-shard"] else [] end)
               + (if $a != "true" then ["a11y-shard"] else [] end) end')"
          failed="$(jq -r --argjson skip "$may_skip" 'to_entries
            | map(select(.value.result != "success"
                and ((.value.result == "skipped" and (.key as $k | $skip | index($k))) | not)))
            | map("\(.key): \(.value.result)") | join(", ")' <<<"$NEEDS")"
          if [ -n "$failed" ]; then
            echo "::error::verify: not every part ran and passed ($failed)"
            exit 1
          fi
          echo "verify: static, the test build, all six test partitions, the doctests, dev-bridge, the Floor's gallery, ui, the visual and accessibility gates, the three platform builds and the release candidate (rc-dev-app) passed (full run: $FULL)." >> "$GITHUB_STEP_SUMMARY"

  # The coverage artifact, off the critical path and never gating
  # (strictness is enforced at gates via the local llvm-cov numbers). It
  # builds the workspace again, instrumented, so it has a runner of its own.
  coverage:
    name: coverage
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Install cargo-llvm-cov (release binary)
        env:
          LLVM_COV_VERSION: v0.9.1
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      # Best-effort in edge cases (zero-test workspaces).
      - name: Coverage (baseline artifact)
        continue-on-error: true
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  # Frontend quality gate: typecheck + production build of the webview UI.
  ui:
    name: ui
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # pnpm via corepack (GitHub-owned actions only, SHA-pinned — org
      # policy); corepack must activate pnpm before setup-node's cache.
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities in what ships (AJ-E2007 R3)
        working-directory: ui
        run: pnpm audit --prod --audit-level moderate
      - name: Component tests (AJ-E402 SessionRow fixtures)
        working-directory: ui
        run: pnpm test
      - name: Lint (AJ-E2012; today's findings baselined, only shrinking)
        working-directory: ui
        run: pnpm lint
      - name: Dead and copied code only shrink (knip, jscpd; AJ-E2011 R7)
        run: |
          python3 scripts/debt_baseline.py --selftest
          python3 scripts/debt_baseline.py
      - name: Build (typecheck + bundle)
        working-directory: ui
        run: pnpm build

  # AJ-E803: the visual regression gate. On changes to the UI, the
  # deterministic matrix is compared with the approved baselines in the
  # pinned Playwright container (the same image `just visual-gate` uses,
  # by digest, on x64 as the baselines were rendered), split by test into
  # four shards; `visual` merges their reports into one.
  visual-shard:
    name: visual (${{ matrix.shard }}/4)
    needs: plan
    if: needs.plan.outputs.visual == 'true' && needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        working-directory: ui
        run: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile
      - name: Compare with the baselines, shard ${{ matrix.shard }}/4
        working-directory: ui
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm exec playwright test -c playwright.regression.config.ts --shard="$SHARD/4" --reporter=list,blob
      - name: Report (merged by `visual`)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-blob-${{ matrix.shard }}
          path: ui/blob-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Triptychs (baseline, current, diff)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-triptychs-${{ matrix.shard }}
          path: ui/test-results/
          retention-days: 14

  # The required check `visual`: baseline changes are explained, and every
  # shard passed (or nothing in the UI changed).
  visual:
    name: visual
    needs: [plan, visual-shard]
    if: always()
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    env:
      RAN: ${{ needs.plan.outputs.visual == 'true' && needs.plan.outputs.tested == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Baseline changes are explained
        if: github.event_name == 'pull_request'
        env:
          EVENT_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        # Only this PR's own baseline changes: diff from where it meets the
        # base branch now (main's later changes aren't the PR's). The body
        # is read fresh so a re-run sees notes added after the push.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body 2>/dev/null || printf '%s' "$EVENT_BODY")"
          PR_BODY="$body" python3 scripts/check_baseline_notes.py "$base"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: always() && env.RAN == 'true'
        with:
          pattern: visual-blob-*
          path: ui/blob-reports/
          merge-multiple: true
      - name: One report from every shard
        if: always() && env.RAN == 'true' && hashFiles('ui/blob-reports/*') != ''
        working-directory: ui
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/visual-gate.json
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile
          pnpm exec playwright merge-reports --reporter=json,html ./blob-reports
      - name: Summary
        if: always() && env.RAN == 'true'
        run: python3 scripts/visual_summary.py ui/test-results/visual-gate.json >> "$GITHUB_STEP_SUMMARY"
      - name: The whole report
        if: always() && env.RAN == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-report
          path: ui/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Every shard passed
        env:
          PLAN: ${{ needs.plan.result }}
          SHARDS: ${{ needs.visual-shard.result }}
          VISUAL: ${{ needs.plan.outputs.visual }}
          TESTED: ${{ needs.plan.outputs.tested }}
        run: |
          [ "$PLAN" = success ] || { echo "::error::plan didn't pass"; exit 1; }
          if [ -n "$TESTED" ]; then
            echo "Visual gate: passed on $TESTED, the same tree (see plan)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FULL" = true ] && [ "$VISUAL" != true ]; then
            echo "::error::a full run must compare every shard, but plan set visual=$VISUAL"; exit 1
          elif [ "$VISUAL" != true ]; then
            echo "Visual gate: no UI change — nothing to compare." >> "$GITHUB_STEP_SUMMARY"
          else
            [ "$SHARDS" = success ] \
              || { echo "::error::a visual shard failed ($SHARDS) — see its log and the visual-triptychs-* artifacts"; exit 1; }
          fi

  # AJ-E804 on every pull request that changes the interface: the same
  # accessibility gate Promote runs (axe on every gallery state, keyboard
  # flows, 200 % zoom and reduced motion, contrast), split by test into
  # six shards, so a regression is caught before it merges rather than at
  # release time. Changes without UI work skip it; `a11y` always reports.
  a11y-shard:
    name: a11y (${{ matrix.shard }}/6)
    permissions:
      contents: read
    needs: plan
    if: needs.plan.outputs.a11y == 'true' && needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install
        working-directory: ui
        run: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile
      - name: Accessibility gate, shard ${{ matrix.shard }}/6
        env:
          A11Y_SKIP_SUMMARY: "1"
          SHARD: ${{ matrix.shard }}
        # Split by test, not by file: the gate is mostly one large spec, so
        # file-level shards left shards 2–4 empty and shard 1 near its timeout.
        run: ./scripts/a11y_gate.sh --fully-parallel --shard="$SHARD/6"
      - name: Scans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-shard-${{ matrix.shard }}
          path: docs/qa/evidence/AJ-E804/
          retention-days: 14

  a11y:
    name: a11y
    permissions:
      contents: read
    needs: [plan, a11y-shard]
    if: always()
    runs-on: ubuntu-latest
    env:
      RAN: ${{ needs.plan.outputs.a11y == 'true' && needs.plan.outputs.tested == '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Nothing to scan
        if: env.RAN != 'true'
        env:
          PLAN: ${{ needs.plan.result }}
          TESTED: ${{ needs.plan.outputs.tested }}
          A11Y: ${{ needs.plan.outputs.a11y }}
        run: |
          [ "$PLAN" = success ] || { echo "::error::plan didn't pass"; exit 1; }
          if [ -n "$TESTED" ]; then
            echo "Accessibility gate: passed on $TESTED, the same tree (see plan)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FULL" = true ]; then
            echo "::error::a full run must scan every shard, but plan set a11y=$A11Y"; exit 1
          else
            echo "Accessibility gate: no UI change — nothing to scan." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Every shard passed
        if: env.RAN == 'true'
        env:
          SHARDS: ${{ needs.a11y-shard.result }}
        run: |
          [ "$SHARDS" = "success" ] \
            || { echo "::error::an accessibility shard failed ($SHARDS) — see its log and the a11y-shard-* artifacts"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.RAN == 'true'
        with:
          pattern: a11y-shard-*
          path: docs/qa/evidence/AJ-E804/
          merge-multiple: true
      - name: Every gallery state, summarised (0 critical, 0 serious)
        if: env.RAN == 'true'
        run: |
          python3 scripts/axe_summary.py
          cat docs/qa/evidence/AJ-E804/axe-summary.md >> "$GITHUB_STEP_SUMMARY"

  # Cross-platform build matrix (spec §1: cross-platform core from day one).
  build-macos:
    name: build-macos
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Build (native arm64)
        run: cargo build --workspace
      - name: Build (x86_64 cross-check)
        run: cargo build --workspace --target x86_64-apple-darwin
      # AJ-E3513: the Floor's Metal smoke render (every gallery frame draws
      # a real picture; a runner without a GPU says so and stops).
      - name: The Floor on Metal
        run: cargo test -p juggler-floor-render
      # AJ-E512: the collateral suite is a REQUIRED gate on macOS too
      # (Linux runs it via `verify`'s workspace tests) — zero-signal
      # assertions on real processes with trap logs, never UI state.
      - name: Collateral suite (AJ-E512)
        run: |
          cargo test -p juggler-supervisor --test collateral
          # The app test binary links the Swift bridge; the runner has
          # no libswift_Concurrency.dylib anywhere (toolchain, SDK, dyld
          # cache). scripts/ensure_swift_runtime.sh's approach applies:
          # an empty stub with the right install name in target/debug
          # (already on the binary's rpath). These suites never CALL
          # the bridge — the stub only satisfies the dyld load.
          mkdir -p target/debug
          echo "" | clang -dynamiclib -o target/debug/libswift_Concurrency.dylib \
            -install_name @rpath/libswift_Concurrency.dylib -x c -
          cargo test -p juggler-app --test guardrails
      # AJ-E1401: the machine signals on the real macOS APIs (memory
      # pressure, Activity Monitor's memory used, power, thermal) — the
      # Linux `verify` job can only run their fallbacks.
      - name: Machine signals on macOS (AJ-E1401)
        # --nocapture: on a host missing a memory counter (GitHub's macOS
        # VM), the host test names which sysctl didn't answer.
        run: |
          sysctl hw.pagesize vm.page_pageable_internal_count vm.page_purgeable_count vm.page_wired_count vm.compressor_bytes_used || true
          cargo test -p juggler-supervisor --lib machine -- --nocapture
          cargo test -p juggler-supervisor --test machine
      - name: A process's CPU on macOS
        # sysinfo here keeps an idle process's last busy figure; Linux can't
        # show it, so only this job proves the idle helper reads 0 %.
        run: cargo test -p juggler-supervisor --lib cpu_since

  # The release candidate (ADR-0025, 2026-11-11: release candidates are
  # built here, not on the shared Mac): AI Juggler Dev, release profile,
  # arm64, unsigned (the linker's ad-hoc signature only), from the same
  # script and pinned toolchain as `just app` and the release build. Then
  # the RC checks the local build ran: every helper inside the bundle, and
  # the first open after an update (the rc8 blocker) on the synthetic v49
  # database, in a real window. Only then is the app uploaded, as
  # `rc-dev-app-<commit>`, for walks: `scripts/qa/fetch_rc.sh <commit>`.
  rc-dev-app:
    name: rc-dev-app
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # The pull request's own commit, not GitHub's merge of it: the app
      # a walk runs is exactly the commit it names.
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
      APP: target/release/bundle/macos/AI Juggler Dev.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.REF }}
          persist-credentials: false
      - name: Toolchain (pinned)
        uses: $/.github/actions/macos-app-toolchain
        with:
          target: aarch64-apple-darwin
      - name: The version it ships as (stamped; bundle_check holds the app to it)
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: ./scripts/ci/rc_version.sh
      - name: Build AI Juggler Dev (as `just app`; checks the bundle)
        run: ./scripts/build_dev_app.sh
      - name: The app, for walks
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rc" && mkdir -p "$out"
          # A tar keeps the bundle's modes and links (an artifact wouldn't);
          # made before the checks run the app.
          tar -C "$(dirname "$APP")" -cf "$out/app.tar" "$(basename "$APP")"
          echo "$REF" > "$out/COMMIT"
          lipo -info "$APP/Contents/MacOS/"*
          codesign -dv "$APP/Contents/MacOS/juggler-app" 2>&1 | grep -E '^(Signature|Identifier|CDHash)' || true
      # The synthetic v49 database (no real data), made as the local RC
      # made it, and the headless measure of its first open (storage ready,
      # sizes). The test binary links the Swift bridge but never calls it:
      # an empty stub satisfies its load (as build-macos's suites do).
      - name: The v49 database, and its first open measured
        run: |
          set -euo pipefail
          mkdir -p target/release "$RUNNER_TEMP/v49"
          echo "" | clang -dynamiclib -o target/release/libswift_Concurrency.dylib \
            -install_name @rpath/libswift_Concurrency.dylib -x c -
          AIJ_KEEP_V49="$RUNNER_TEMP/v49/juggler.sqlite" \
            cargo test --release -p juggler-app --test first_open_measure -- --ignored --nocapture
          ls -l "$RUNNER_TEMP/v49"
      # The window check reads windows through System Events, which needs
      # the runner's Accessibility and Automation grants (GitHub's macOS
      # images set them for the runner). Probed first, bounded, so a
      # missing grant fails here with its reason, never as a hang or as
      # "no window".
      - name: The runner can read windows (System Events)
        run: |
          if ! perl -e 'alarm 30; exec @ARGV' osascript -e \
            'tell application "System Events" to get name of windows of (first application process whose frontmost is true)'; then
            echo "::error::System Events can't read windows on this runner (Accessibility/Automation not granted): the first-open window check can't run"
            exit 1
          fi
      # The VM starts a new build only after macOS has scanned it (up to a
      # minute, untimed; the run at 0dcd5cd3d gave it 10 s and failed with
      # "didn't start"). A launch that never comes prints the system's
      # account of it (crash/kill report, log lines).
      - name: First open after an update brings the main window (rc8)
        run: ./scripts/qa/first_open_window_check.sh "$APP" "$RUNNER_TEMP/v49/juggler.sqlite"
      # Only a release candidate that passed its checks is there to walk.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-dev-app-${{ env.REF }}
          path: ${{ runner.temp }}/rc/
          retention-days: 14
          if-no-files-found: error

  build-linux:
    name: build-linux
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install Tauri system dependencies (Linux)
        timeout-minutes: 25
        run: ./scripts/ci/apt_install.sh libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      # Cross-platform readiness §5.1: the tests compile here too, not only
      # the app (a Unix-only test must say `#![cfg(unix)]`).
      - name: Check every target (tests included)
        run: cargo check --workspace --all-targets
      - name: Build
        run: cargo build --workspace

  build-windows:
    name: build-windows
    needs: plan
    if: needs.plan.outputs.tested == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      # Cross-platform readiness §5.1: the tests compile on Windows too (a
      # Unix-only test must say `#![cfg(unix)]`); running them comes with
      # the Windows seams (§5.4).
      - name: Check every target (tests included)
        run: cargo check --workspace --all-targets
      - name: Build
        run: cargo build --workspace
