name: CI

on:
  push:
    branches: [main]
  # Every pull request, whatever its base: main and the release/* branches
  # (one PR per release), so the Linux and Windows jobs see release/*
  # code before it merges.
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short


# The token reads only (CodeQL actions/missing-workflow-permissions): the
# visual job reads the PR's body; a job needing more says so itself.
permissions:
  contents: read
  pull-requests: read

jobs:
  # The full quality gate (docs/plan/QUALITY.md). Mirrors `just verify` plus
  # cargo-deny and coverage; its name is a required status check on main.
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      # Line tables only: a failing test still names its file and line, but
      # the test build is a fraction of its size. With full debug info it
      # took about 100 GB (main had 3.3 GB left before coverage on
      # 2026-10-29) and 0.3's dev-bridge build ran out of disk (#198).
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      # The full gate (coverage, three clippy variants, every test binary)
      # outgrew the runner's free disk (#148, 2026-10-23: "No space left on
      # device"). This job never uses these preinstalled SDKs.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      # Restored here, saved before coverage (below): the cache holds the
      # test build only. Saved with coverage's instrumented build in it, it
      # grew to 12 GB and filled the disk (#175, 2026-10-24).
      - name: Cargo cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # "-lt": builds with line tables only (above). An older cache, built
          # with full debug info, would be rebuilt beside itself.
          key: ${{ runner.os }}-${{ github.job }}-cargo-lt-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-lt-
      - name: Install cargo-llvm-cov and cargo-deny (release binaries)
        env:
          LLVM_COV_VERSION: v0.9.1
          DENY_VERSION: 0.20.2
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/taiki-e/cargo-llvm-cov/releases/download/${LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          deny="cargo-deny-${DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${deny}.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${deny}.tar.gz.sha256"
          echo "$(cut -d' ' -f1 "${deny}.tar.gz.sha256")  ${deny}.tar.gz" | sha256sum -c -
          tar -xzf "${deny}.tar.gz"
          mv "${deny}/cargo-deny" "$HOME/.local/bin/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # --no-fail-fast: every failing test in one run, not the first
      # binary's only (#198 took four runs to show four problems).
      - name: Tests
        run: |
          cargo test --workspace --no-fail-fast
          ./scripts/leaked_fixtures.sh
      - name: Room left on the runner
        shell: bash
        run: |
          free=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "Free after the test build: ${free} GB"
          if [ "$free" -lt 15 ]; then
            echo "::warning::Only ${free} GB free after the test build; the dev-bridge build and coverage need room (#198 ran out)."
          fi
      - name: Read-only test bridge (Dev builds only; docs/qa/DEV-BRIDGE.md)
        run: |
          df -h /
          cargo clippy -p juggler-app --all-targets --features dev-bridge -- -D warnings
          cargo test -p juggler-app --features dev-bridge --lib dev_bridge
          ./scripts/dev_bridge_check.sh
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Evidence store (AJ-E801 gate)
        run: ./scripts/evidence_check.sh
      - name: A design critique beside every gallery family's captures (AJ-E2814, D-57)
        run: |
          python3 scripts/critique_check.py --selftest
          python3 scripts/critique_check.py
      - name: Terminology and plain words (AJ-E108, AJ-E1535 gates)
        run: |
          ./scripts/terminology_lint.sh
          python3 scripts/plain_words_lint.py --selftest
          python3 scripts/plain_words_lint.py
      - name: Every link in the public docs resolves (the 0.1 checklist, 8.8)
        run: python3 scripts/docs_links_check.py
      - name: No tool-id literal outside the adapters (AJ-E1525, ADR-0019)
        run: |
          python3 scripts/tool_literal_lint.py --selftest
          python3 scripts/tool_literal_lint.py
      - name: No new macOS- or Unix-only assumption outside the platform seams
        run: |
          python3 scripts/platform_lint.py --selftest
          python3 scripts/platform_lint.py
      - name: Layering, IPC audit, size budget and machine reads (AJ-E2011)
        run: |
          python3 scripts/check_layering.py --selftest
          python3 scripts/check_layering.py
          python3 scripts/ipc_audit.py --selftest
          python3 scripts/ipc_audit.py
          python3 scripts/size_budget.py --selftest
          python3 scripts/size_budget.py
          python3 scripts/machine_state_lint.py --selftest
          python3 scripts/machine_state_lint.py
      - name: Task counts and ranges in the docs match the epic files
        run: |
          python3 scripts/check_task_counts.py --selftest
          python3 scripts/check_task_counts.py
      - name: Usage-statistics doc is generated from the schema (AJ-E1106)
        run: python3 scripts/gen_usage_stats_doc.py --check
      - name: Usage-statistics types are generated from the schema; the stats feature leaves them out (AJ-E1102)
        run: |
          python3 scripts/gen_stats_events.py --check
          ./scripts/stats_feature_check.sh
      - name: Release scripts (D-20, D-24 self-tests)
        run: |
          python3 scripts/release_version.py --selftest
          python3 scripts/release_ships.py --selftest
          python3 scripts/nightly_notes.py --selftest
          python3 scripts/downgrade_note.py --selftest
          python3 scripts/promotion_rules.py --selftest
          python3 scripts/apple_retry.py --selftest
      - name: Dependency policy (cargo-deny)
        run: cargo deny check
      - name: The local gate runs what this job runs (`just verify`)
        run: |
          python3 scripts/ci_parity.py --selftest
          python3 scripts/ci_parity.py
      - name: Save the Cargo cache (the test build, before coverage)
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      # Coverage builds the workspace again, instrumented, beside the test
      # build: with both, the runner's disk ran out (#175, 2026-10-23). The
      # tests have run and the cache is saved, so their build goes first.
      - name: Make room for coverage
        run: |
          df -h /
          rm -rf target/debug target/llvm-cov-target
          df -h /
      # Coverage artifact. Best-effort in edge cases (zero-test workspaces);
      # strictness is enforced at gates via the local llvm-cov numbers.
      - name: Coverage (baseline artifact)
        continue-on-error: true
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  # Frontend quality gate: typecheck + production build of the webview UI.
  ui:
    name: ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # pnpm via corepack (GitHub-owned actions only, SHA-pinned — org
      # policy); corepack must activate pnpm before setup-node's cache.
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10 --activate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: Install
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Component tests (AJ-E402 SessionRow fixtures)
        working-directory: ui
        run: pnpm test
      - name: Build (typecheck + bundle)
        working-directory: ui
        run: pnpm build

  # AJ-E803: the visual regression gate — on PRs that change the UI, the
  # deterministic matrix is compared with the approved baselines in the
  # pinned Playwright container (the same image `just visual-gate` uses).
  visual:
    name: visual
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did this change touch the UI?
        id: scope
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || git diff --name-only "$base" HEAD | grep -q '^ui/'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
            echo "Visual gate: no UI change — nothing to compare." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Baseline changes are explained
        if: github.event_name == 'pull_request'
        env:
          EVENT_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        # Only this PR's own baseline changes: diff from where it meets the
        # base branch now (main's later changes aren't the PR's). The body
        # is read fresh so a re-run sees notes added after the push.
        run: |
          base="$(git merge-base "origin/$BASE_REF" HEAD)"
          body="$(gh pr view "$PR_NUMBER" --json body --jq .body 2>/dev/null || printf '%s' "$EVENT_BODY")"
          PR_BODY="$body" python3 scripts/check_baseline_notes.py "$base"
      - name: Install
        if: steps.scope.outputs.ui == 'true'
        working-directory: ui
        run: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile
      - name: Compare with the baselines
        if: steps.scope.outputs.ui == 'true'
        working-directory: ui
        run: pnpm exec playwright test -c playwright.regression.config.ts
      - name: Summary
        if: always() && steps.scope.outputs.ui == 'true'
        run: python3 scripts/visual_summary.py ui/test-results/visual-gate.json >> "$GITHUB_STEP_SUMMARY"
      - name: Triptychs (baseline, current, diff)
        if: failure() && steps.scope.outputs.ui == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-triptychs
          path: ui/test-results/
          retention-days: 14

  # AJ-E804 on every pull request that changes the interface: the same
  # accessibility gate Promote runs (axe on every gallery state, keyboard
  # flows, 200 % zoom and reduced motion, contrast), in the same four
  # shards, so a regression is caught before it merges rather than at
  # release time. Changes without UI work skip it; `a11y` always reports.
  a11y-scope:
    name: a11y scope
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Did this change touch the UI or the gate itself?
        id: scope
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || git diff --name-only "$base" HEAD | grep -qE '^ui/|^scripts/(a11y_gate\.sh|axe_summary\.py)$|^\.github/workflows/ci\.yml$'; then
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  a11y-shard:
    name: a11y (${{ matrix.shard }}/4)
    permissions:
      contents: read
    needs: a11y-scope
    if: needs.a11y-scope.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install
        working-directory: ui
        run: corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile
      - name: Accessibility gate, shard ${{ matrix.shard }}/4
        env:
          A11Y_SKIP_SUMMARY: "1"
        # Split by test, not by file: the gate is mostly one large spec, so
        # file-level shards left shards 2–4 empty and shard 1 near its timeout.
        run: ./scripts/a11y_gate.sh --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Scans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-shard-${{ matrix.shard }}
          path: docs/qa/evidence/AJ-E804/
          retention-days: 14

  a11y:
    name: a11y
    permissions:
      contents: read
    needs: [a11y-scope, a11y-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No UI change
        if: needs.a11y-scope.outputs.ui != 'true'
        run: |
          echo "Accessibility gate: no UI change — nothing to scan." >> "$GITHUB_STEP_SUMMARY"
      - name: Every shard passed
        if: needs.a11y-scope.outputs.ui == 'true'
        run: |
          [ "${{ needs.a11y-shard.result }}" = "success" ] \
            || { echo "::error::an accessibility shard failed (${{ needs.a11y-shard.result }}) — see its log and the a11y-shard-* artifacts"; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.a11y-scope.outputs.ui == 'true'
        with:
          pattern: a11y-shard-*
          path: docs/qa/evidence/AJ-E804/
          merge-multiple: true
      - name: Every gallery state, summarised (0 critical, 0 serious)
        if: needs.a11y-scope.outputs.ui == 'true'
        run: |
          python3 scripts/axe_summary.py
          cat docs/qa/evidence/AJ-E804/axe-summary.md >> "$GITHUB_STEP_SUMMARY"

  # Cross-platform build matrix (spec §1: cross-platform core from day one).
  build-macos:
    name: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      - name: Add x86_64 target
        run: rustup target add x86_64-apple-darwin
      - name: Build (native arm64)
        run: cargo build --workspace
      - name: Build (x86_64 cross-check)
        run: cargo build --workspace --target x86_64-apple-darwin
      # AJ-E512: the collateral suite is a REQUIRED gate on macOS too
      # (Linux runs it via `verify`'s workspace tests) — zero-signal
      # assertions on real processes with trap logs, never UI state.
      - name: Collateral suite (AJ-E512)
        run: |
          cargo test -p juggler-supervisor --test collateral
          # The app test binary links the Swift bridge; the runner has
          # no libswift_Concurrency.dylib anywhere (toolchain, SDK, dyld
          # cache). scripts/ensure_swift_runtime.sh's approach applies:
          # an empty stub with the right install name in target/debug
          # (already on the binary's rpath). These suites never CALL
          # the bridge — the stub only satisfies the dyld load.
          mkdir -p target/debug
          echo "" | clang -dynamiclib -o target/debug/libswift_Concurrency.dylib \
            -install_name @rpath/libswift_Concurrency.dylib -x c -
          cargo test -p juggler-app --test guardrails
      # AJ-E1401: the machine signals on the real macOS APIs (memory
      # pressure, Activity Monitor's memory used, power, thermal) — the
      # Linux `verify` job can only run their fallbacks.
      - name: Machine signals on macOS (AJ-E1401)
        # --nocapture: on a host missing a memory counter (GitHub's macOS
        # VM), the host test names which sysctl didn't answer.
        run: |
          sysctl hw.pagesize vm.page_pageable_internal_count vm.page_purgeable_count vm.page_wired_count vm.compressor_bytes_used || true
          cargo test -p juggler-supervisor --lib machine -- --nocapture
          cargo test -p juggler-supervisor --test machine
      - name: A process's CPU on macOS
        # sysinfo here keeps an idle process's last busy figure; Linux can't
        # show it, so only this job proves the idle helper reads 0 %.
        run: cargo test -p juggler-supervisor --lib cpu_since

  build-linux:
    name: build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      # Cross-platform readiness §5.1: the tests compile here too, not only
      # the app (a Unix-only test must say `#![cfg(unix)]`).
      - name: Check every target (tests included)
        run: cargo check --workspace --all-targets
      - name: Build
        run: cargo build --workspace

  build-windows:
    name: build-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-${{ github.job }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-${{ github.job }}-cargo-
      # Cross-platform readiness §5.1: the tests compile on Windows too (a
      # Unix-only test must say `#![cfg(unix)]`); running them comes with
      # the Windows seams (§5.4).
      - name: Check every target (tests included)
        run: cargo check --workspace --all-targets
      - name: Build
        run: cargo build --workspace
