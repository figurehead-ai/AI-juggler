# D-20: promote one already-built, signed version to the beta or stable
# channel. Every promotion waits for the maintainer's approval (the
# `beta` and `stable` GitHub environments require it). Nothing is
# rebuilt: the channel's feed is pointed at the same build.
#
# Beta needs: the build exists, its user-facing notes
# (docs/releases/X.Y.Z.md on main) pass the notes check, the
# accessibility gate passes on the exact commit it was built from, and
# the D-24 requirements hold: the build is 3+ days old (real use as AI
# Juggler Nightly) and no `blocker` issue is open.
# Stable also needs: 14+ days on beta, no open `blocker`, the beta gate
# (docs/qa/gate-beta.md, AJ-E807) signed, and a CHANGELOG section. A
# D-24 requirement can be overridden only with a written reason, which
# is kept in the channel tag.
name: Promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote (X.Y.Z, an existing build)"
        type: string
        required: true
      channel:
        description: "Channel to move to it"
        type: choice
        options: [beta, stable]
        required: true
      override:
        description: "Only to promote despite an unmet requirement (D-24): why"
        type: string
        required: false
        default: ""

# Each job asks for what it needs (AJ-E2001): the checks and the
# accessibility gate (which installs and runs the UI's dependencies) read;
# only the approved promote job writes.
permissions: {}

concurrency:
  group: promote-${{ inputs.channel }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  CHANNEL: ${{ inputs.channel }}
  OVERRIDE: ${{ inputs.override }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
          # Tags: the downgrade-note check compares the database schema of
          # this version with the version the channel serves now.
          fetch-depth: 0
      - name: The build, its notes, its history
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::$VERSION is not X.Y.Z"; exit 1; }
          ref="$(gh release view "v$VERSION" --repo "$REPO" --json targetCommitish --jq .targetCommitish)" \
            || { echo "::error::no build v$VERSION — nightly.yml makes builds"; exit 1; }
          # Only a commit on main is promoted: the jobs below run its scripts.
          sha="$(git rev-parse --verify "$ref^{commit}")" \
            || { echo "::error::v$VERSION's commit $ref isn't in this repository"; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::v$VERSION's commit $sha isn't on main"; exit 1; }
          ref="$sha"
          # Users on the channel come from the version it serves now: a
          # database change since then needs a downgrade note.
          serving="$(git tag -l "$CHANNEL/v*" | sed "s|^$CHANNEL/||" | sort -V | tail -1)"
          ./scripts/release_notes_check.sh "$VERSION" ${serving:+"$serving"}
          # D-24: the channel's requirements, decided by promotion_rules.py.
          built_at="$(gh release view "v$VERSION" --repo "$REPO" --json publishedAt --jq .publishedAt)"
          beta_at=""
          if beta_ref="$(gh api "repos/$REPO/git/ref/tags/beta/v$VERSION" --jq '.object.type + " " + .object.sha' 2>/dev/null)"; then
            # An annotated tag carries the date the version reached beta.
            [ "${beta_ref%% *}" = "tag" ] && beta_at="$(gh api "repos/$REPO/git/tags/${beta_ref#* }" --jq .tagger.date)"
          fi
          gh issue list --repo "$REPO" --label blocker --state open --json number,title > "$RUNNER_TEMP/blockers.json"
          python3 - "$RUNNER_TEMP/facts.json" "$built_at" "$beta_at" "$RUNNER_TEMP/blockers.json" <<'PY'
          import datetime, json, os, sys
          out, built_at, beta_at, blockers = sys.argv[1:]
          json.dump({
            "now": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "built_at": built_at or None,
            "beta_at": beta_at or None,
            "blockers": json.load(open(blockers)),
            "override": os.environ.get("OVERRIDE", ""),
          }, open(out, "w"))
          PY
          python3 scripts/promotion_rules.py check "$CHANNEL" "$RUNNER_TEMP/facts.json" | tee "$RUNNER_TEMP/rules.txt"
          { echo '```'; cat "$RUNNER_TEMP/rules.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHANNEL" = "stable" ]; then
            gh api "repos/$REPO/git/ref/tags/beta/v$VERSION" >/dev/null 2>&1 \
              || { echo "::error::v$VERSION was never on beta — promote it to beta first"; exit 1; }
            python3 scripts/gate_packet.py signed docs/qa/gate-beta.md
            grep -q "^## \[$VERSION\]" CHANGELOG.md \
              || { echo "::error::CHANGELOG.md has no [$VERSION] section"; exit 1; }
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Promote $VERSION ($ref) to $CHANNEL" >> "$GITHUB_STEP_SUMMARY"

  # AJ-E804: no build reaches beta or stable with a critical or serious
  # accessibility violation or a broken keyboard flow. The full scan is
  # ~10 min on 30 cores, so it runs in four shards; `a11y` summarises.
  a11y-shard:
    name: a11y (${{ matrix.shard }}/4)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.ref }}
      - name: Install
        working-directory: ui
        # The release's pnpm, pinned with its sha512 as build-macos.yml does.
        run: corepack enable && corepack prepare "pnpm@10.34.7+sha512.ba98abc585539933375b5971f4bc6d6c73a1b4b7edc4a879e7d102fe5423d1e02309d67c60a11f04955093a96e521ad9c3b138cdd654ca5be563f378b3ae48bd" --activate && pnpm install --frozen-lockfile
      - name: Accessibility gate, shard ${{ matrix.shard }}/4
        env:
          A11Y_SKIP_SUMMARY: "1"
        # Split by test, not by file: the gate is mostly one large spec, so
        # file-level shards left shards 2–4 empty and shard 1 near its timeout.
        run: ./scripts/a11y_gate.sh --fully-parallel --shard=${{ matrix.shard }}/4
      - name: Scans
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-shard-${{ matrix.shard }}
          path: docs/qa/evidence/AJ-E804/
          retention-days: 30

  a11y:
    name: a11y
    needs: [check, a11y-shard]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.check.outputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: a11y-shard-*
          path: docs/qa/evidence/AJ-E804/
          merge-multiple: true
      - name: Every gallery state, summarised (0 critical, 0 serious)
        run: |
          python3 scripts/axe_summary.py
          cat docs/qa/evidence/AJ-E804/axe-summary.md >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: promote to ${{ inputs.channel }}
    needs: [check, a11y]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The approval: the environment requires the maintainer.
    environment: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Point the channel at this build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ needs.check.outputs.ref }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/channel" && mkdir -p "$work"
          gh release download "v$VERSION" --repo "$REPO" --pattern latest.json --dir "$work"
          # The channel's users read the hand-written notes, not the nightly ones.
          python3 - "$work/latest.json" "docs/releases/$VERSION.md" <<'PY'
          import json, sys
          feed = json.load(open(sys.argv[1]))
          assert feed["version"] and feed["platforms"], "bad feed"
          # D-23: beta and stable carry AI Juggler, never AI Juggler Nightly.
          assert all("AI-Juggler-Nightly-" not in p["url"] for p in feed["platforms"].values()), "Nightly app in a beta/stable feed"
          feed["notes"] = open(sys.argv[2]).read()
          json.dump(feed, open(sys.argv[1], "w"), indent=2)
          PY
          gh release edit "v$VERSION" --repo "$REPO" --notes-file "docs/releases/$VERSION.md"
          gh release upload "v$VERSION" "$work/latest.json" --repo "$REPO" --clobber
          if ! gh release view "$CHANNEL-channel" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$CHANNEL-channel" --repo "$REPO" --prerelease \
              --title "${CHANNEL^} channel (update feed)" \
              --notes "The update feed ${CHANNEL} installs read. Not a release: download a version from the list above."
          fi
          gh release upload "$CHANNEL-channel" "$work/latest.json" --repo "$REPO" --clobber
          # A record of where this build has been and since when: an
          # annotated tag, whose date stable's 14 days count from (D-24).
          message="v$VERSION on $CHANNEL"
          [ -n "$OVERRIDE" ] && message="$message (requirement overridden: $OVERRIDE)"
          tag="$(gh api "repos/$REPO/git/tags" -f tag="$CHANNEL/v$VERSION" -f message="$message" \
            -f object="$REF" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' \
            -f "tagger[date]=$(date -u +%Y-%m-%dT%H:%M:%SZ)" --jq .sha)"
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$CHANNEL/v$VERSION" -f sha="$tag" >/dev/null \
            || echo "tag $CHANNEL/v$VERSION already exists"
          if [ "$CHANNEL" = "stable" ]; then
            gh release edit "v$VERSION" --repo "$REPO" --prerelease=false --latest
          fi
          echo "${CHANNEL^} channel → $VERSION" >> "$GITHUB_STEP_SUMMARY"
