name: Bug report
description: Something in AI Juggler is broken or behaves wrongly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **This issue is public.** Before pasting logs or screenshots, remove
        account names, email addresses, home-folder paths and tokens. Never
        share a tool's credentials. For a security problem, use private
        reporting instead (see [SECURITY.md](https://github.com/figurehead-ai/AI-juggler/blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        Steps:
        1. …
        2. …

        Expected: …
        What happened: …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AI Juggler version
      description: Settings › About & updates shows it.
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Which app and channel?
      options:
        - AI Juggler, Stable
        - AI Juggler, Beta
        - AI Juggler Nightly
        - Built from source
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: e.g. macOS 15.4, Apple silicon
    validations:
      required: true
  - type: dropdown
    id: tools
    attributes:
      label: Which tools were involved?
      multiple: true
      options:
        - Claude Code
        - Codex
        - The Claude app
        - None in particular
  - type: input
    id: tool-versions
    attributes:
      label: Tool versions
      description: The output of `claude --version` and `codex --version`, if they were involved.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Anything that helps. Remove names, emails, paths and tokens first.
      render: shell
