[package]
name = "floor-office"
version = "0.1.0"
edition = "2021"
publish = false
description = "The Floor: first prototype of the office in a native wgpu window, with per-App style kits"

# Its own workspace, so it never joins the app's build.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder", "NSGraphics", "NSEvent", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
block2 = "0.6"

[profile.release]
strip = true
