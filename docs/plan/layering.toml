# AJ-E2011 / ENGINEERING-GUIDE A1: the allowed dependency graph between the
# workspace's crates. Dependencies point inward: juggler-core knows no
# tool, no Tauri and no UI; only juggler-app (the composition root and
# the IPC edge) knows everything. scripts/check_layering.py compares
# `cargo metadata` against this file in `just verify` and CI. A new edge
# needs a line here and a reason in its PR.

[allow]
juggler-core = []
juggler-account = []
# AJ-E1704: the agent bridge program; depends on nothing of ours (it holds
# no state and only speaks to the app over its socket).
juggler-agentbridge = []
juggler-stats = []
juggler-scap-init = []
# D-26: the audited SMAppService shim (open at login); depends on nothing of ours.
juggler-login-item = []
# D-27: the audited host_statistics64 shim (the compressor's pages); depends on nothing of ours.
juggler-vm-stats = []
# The OS seams (cross-platform audit C5): who we are, owner-only files,
# local sockets, program trust. Knows no tool and no product, so it sits
# below everything and depends on nothing of ours.
juggler-platform = []
juggler-adapter = ["juggler-core", "juggler-platform"]
juggler-adapters = ["juggler-adapter", "juggler-core"]
juggler-supervisor = ["juggler-adapter", "juggler-core", "juggler-vm-stats"]
juggler-handover = ["juggler-adapter", "juggler-core", "juggler-platform"]
juggler-link = ["juggler-core"]
juggler-app = [
  "juggler-account",
  "juggler-agentbridge",
  "juggler-adapter",
  "juggler-adapters",
  "juggler-core",
  "juggler-handover",
  "juggler-link",
  "juggler-login-item",
  "juggler-platform",
  "juggler-scap-init",
  "juggler-stats",
  "juggler-supervisor",
]

# A6: an adapter module never imports a sibling tool's module; shared
# mechanics live in neutral modules (transcript.rs, inference.rs,
# quota_ingest.rs, scan_signals.rs). Each tool's modules in
# crates/juggler-adapters/src, by family:
[adapters.families]
claude = ["claude_bridge", "claude_code", "claude_environment", "claude_handover", "claude_live", "claude_transcript"]
codex = ["codex", "codex_bridge", "codex_environment", "codex_handover", "codex_live", "codex_transcript"]
fake = ["fake"]
fake_desktop = ["fake_desktop"]

# Today's sibling imports ("from -> to"), which may only go away: the
# shared pieces move to neutral modules (ADR-0019 §2).
[adapters]
allow_sibling = [
  "codex -> claude_code",
  "codex_environment -> claude_environment",
  "codex_transcript -> claude_transcript",
]
