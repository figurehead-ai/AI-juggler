id = "N5"
title = "The usual is out of room"
epic = "E32"
decisions = ["D-62.24", "D-31"]
layers = ["L3", "L4"]
exercises = ["New session"]
needs = ["replica"]

[setup]
projects = ["web"]
# History: one usual: Claude Code · Work in web (seeded by the sessions below).
# Room: the usual is out (cc-work's room_used = 100).

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"
room_used = 100

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

# The usual, as data: the last session was Claude Code · Work in web.
[[setup.sessions]]
id = "usual"
app = "cc-work"
project = "web"
state = "ended"

[[steps]]
do = "Open New session while the usual App is out of room"
expect = "It says so before you start and offers the App with room; never switches silently (D-31)"
