id = "P8"
title = "Scouts"
epic = "E30"
decisions = ["D-62.15", "D-62.17", "D-44"]
layers = ["L2", "L4"]
exercises = ["all talk allowed", "ending sessions", "shell-only member"]
needs = ["lab"]

[setup]
projects = ["research"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "codex-personal"
tool = "codex"
account = "Personal"
profile = "default"

# `shell_only`: how the walk expects each scout's member to be labelled;
# the seeder checks it against the adapter (the rc26 walk: OpenCode takes
# the agent tools per launch since AJ-E3002 R3, so it isn't shell only).
[[setup.apps]]
id = "opencode"
tool = "opencode"
account = ""
profile = "default"
shell_only = false

[[setup.apps]]
id = "kimi"
tool = "kimi-code"
account = ""
profile = "default"
shell_only = true

[[setup.sessions]]
id = "s1"
app = "cc-work"
project = "research"
state = "working"

[[setup.sessions]]
id = "s2"
app = "codex-personal"
project = "research"
state = "working"

[[setup.sessions]]
id = "s3"
app = "opencode"
project = "research"
state = "working"

[[setup.sessions]]
id = "s4"
app = "kimi"
project = "research"
state = "working"

[[setup.pools]]
name = "Scouts"
template = "scouts"
scope = "research"

[[setup.members]]
pool = "Scouts"
kind = "everyone"
ref = "scope"
role = "member"

[[steps]]
do = "Ask each scout to message another and share a doc through the pool's tools (send_message, share_doc); never a connector, an artifact, Docs or any sharing outside the pool"
expect = "All talk is allowed; the messages are in the pool's Messages and the docs in its Shared documents"

[[steps]]
do = "End two scouts"
expect = "They fade; their tasks follow D-44"

[[steps]]
do = "Look at the OpenCode scout"
expect = "No Shell only label: its launches get the pool's tools (AJ-E3002 R3), as the Claude Code and Codex scouts' do"

[[steps]]
do = "Look at the Kimi Code scout"
expect = "It is labelled Shell only, says why, and does what its shell allows"
