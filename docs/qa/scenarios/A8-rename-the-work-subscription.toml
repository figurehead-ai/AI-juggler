id = "A8"
title = "Rename the work subscription"
epic = "E32"
decisions = ["D-62.4", "D-62.6"]
layers = ["L2", "L3", "L4"]
exercises = ["one name everywhere"]
needs = ["replica"]

[setup]
projects = ["web", "api"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.sessions]]
id = "w1"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "a1"
app = "app-work"
project = "web"
state = "idle"

[[setup.sessions]]
id = "p1"
app = "cc-personal"
project = "api"
state = "ended"

[[steps]]
do = "Rename Work to Acme on its Account page"
expect = "The new name shows everywhere: rail, pickers, notices, pools, ⌘K"

[[steps]]
do = "Set its renewal once"
expect = "Its folders all show the one renewal"
