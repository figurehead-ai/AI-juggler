id = "X2"
title = "Load"
epic = "E33"
decisions = ["D-62.20"]
layers = ["L5"]
exercises = ["50-member pool", "membership changes without re-reads"]
needs = ["lab", "rc"]

[setup]
projects = ["web"]
pool_members = 50

[[setup.pools]]
name = "Big"
scope = "web"

[[steps]]
do = "Open the 50-member pool"
expect = "It opens at once from the cached roster"
measure = "first paint ≤ 100 ms"

[[steps]]
do = "Turn on Settings › Advanced › Debug mode › Keep a detailed log (the pool steps are written only while it is on), then change a membership"
expect = "It resolves without re-reading sessions; the debug log (Settings' Show, or the file `logs/debug.log` in AI Juggler Dev's data folder) has one `pool` line for it: moved, joined, left, role or lead"

[[steps]]
do = "Quit AI Juggler as asked, start it again, and watch its CPU (Activity Monitor or ps, every 5 s) for 2 minutes"
expect = "Its conversation list shows at once; above 50 % CPU for at most 10 s after the start (the saved conversation list and subagent checkpoints: the go sitting's release build on a heavy real Mac, 2026-11-07, went from about 40 s at 100-200 % to one 5 s sample), then under 20 % while idle (known, not a release blocker: 5-18 % idle on that Mac with its live sessions; the aim is under 3 %, after 0.4.1)"
