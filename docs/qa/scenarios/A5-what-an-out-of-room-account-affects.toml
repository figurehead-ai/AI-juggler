id = "A5"
title = "What an out-of-room Account affects"
epic = "E32"
decisions = ["D-62.7", "D-31"]
layers = ["L2", "L3", "L4"]
exercises = ["out of room"]
needs = ["replica"]

[setup]
projects = ["web", "api"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"
room_used = 100

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true
room_used = 100

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.sessions]]
id = "w1"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "a1"
app = "app-work"
project = "web"
state = "idle"

[[setup.sessions]]
id = "p1"
app = "cc-personal"
project = "api"
state = "ended"

[[steps]]
do = "Make Work out of room in the lab; open its Account page"
expect = "Everything it affects is reachable from the page: its Apps, open sessions, projects, and a switch for each"
