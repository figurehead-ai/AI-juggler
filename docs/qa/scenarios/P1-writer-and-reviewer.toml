id = "P1"
title = "Writer and reviewer"
epic = "E30"
decisions = ["D-62.9", "D-62.12", "D-62.15", "D-62.18", "D-44"]
layers = ["L2", "L3", "L4"]
exercises = ["App member", "auto-join", "Reviewer", "switching", "watched to full"]
needs = ["lab", "live-claude", "live-codex"]

[setup]
projects = ["web"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "codex-personal"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.apps]]
id = "claude-app"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.sessions]]
id = "writer"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "checker"
app = "codex-personal"
project = "web"
state = "idle"

[[setup.sessions]]
id = "app-chat"
app = "claude-app"
project = "web"
state = "idle"

[[steps]]
do = "New pool → Writer and reviewer; scope: one project (web)"
expect = "The wizard opens on Template with Writer and reviewer chosen (its card names Lead, Reviewer and talk); Next goes to Where and who, with web picked; its roles are on Roles and talk"
measure = "click to wizard ≤ 100 ms"

[[steps]]
do = "Pick a Claude Code · Work session, the App Claude Code · Work and the Codex session (or its App); on Roles and talk, make the session Lead, the App a Member and the Codex one Reviewer"
expect = "The side panel says which sessions join now and which join later; the App's role offers Member, Reviewer and Observer only, with the line \"Lead is one session; pick one of this App's sessions to lead.\" (D-92). With no session picked (none open), Roles and Review say \"No Lead yet: …\" and how one is chosen once a session runs"

[[steps]]
do = "Make the pool"
expect = "The canvas shows both; the review step (each member with its role) and the canvas say the same members, roles and talk"

[[steps]]
do = "The writer claims a task and marks it in review"
expect = "The task shows In review with the writer as holder"

[[steps]]
do = "The Reviewer sends it back with a note, then approves it"
expect = "Sent back and approved show as the Reviewer's verdicts; the final Approve stays the person's (D-44)"

[[steps]]
do = "The writer's account runs out of room; switch it to Codex · Personal"
expect = "The switch check says it stays in the pool with full tools; its tasks and messages come along"

[[steps]]
do = "Start a new Claude Code · Work session in web"
expect = "It joins the pool by itself as a Member (the App's role), without a click; the pool keeps one Lead (D-92)"

[[steps]]
do = "Open Add on the pool"
expect = "A running Claude app session is under Sessions in other apps with Add as watched and its reason (can't reply); the Claude app itself, under Apps, keeps Add and says its sessions join watched (D-62 decision 15: offered with the reason, never greyed)"

[[steps]]
do = "Add it as Watched, then Continue in AI Juggler"
expect = "It is drawn dashed until continued; continued, it gets the agent tools and matches the member as itself"
