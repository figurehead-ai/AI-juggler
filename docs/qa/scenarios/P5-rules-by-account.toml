id = "P5"
title = "Rules by account"
epic = "E30"
decisions = ["D-62.9", "D-62.11", "D-62.12"]
layers = ["L1", "L2", "L4"]
exercises = ["Account member at Read", "a session's own level wins", "sign-in unreadable", "App changes Account"]
needs = ["lab"]

[setup]
projects = ["web"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "codex-personal"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.apps]]
id = "codex-personal-2"
tool = "codex"
account = "Personal"
profile = "second"

[[setup.pools]]
name = "Careful"
scope = "web"

[[setup.members]]
pool = "Careful"
kind = "account"
ref = "Personal"
role = "member"
level = "read"

# p1 and p2 are started in the walk: a seeded working or idle session
# has no process in a lab and opens as ended (the rc31 walk). Every App
# here gets its tool's lab sign-in on its Account (scenario.py check).
[[steps]]
do = "Start p1, then p2, on Codex · Personal · default in web"
expect = "Both join Careful at Read, as Personal's"

[[steps]]
do = "Start a session on the other App of the Personal account"
expect = "It joins Careful at Read"

# Named on its own: the canvas inspector's "Its level here" on p2's node
# (D-62.12, pools-model §4.2: one session named on its own overrides a
# broad member's level; the rc33 walk found no control for it).
[[steps]]
do = "Name p2 on its own as Work together (select p2 on Careful's canvas, Its level here › Work together)"
expect = "p2's own level wins inside Careful; p1 stays at Read"

[[steps]]
do = "In the lab, make Personal's sign-in unreadable"
expect = "The pool shows 'Account unknown'; a session also in by another member stays in"

[[steps]]
do = "Sign one Personal App in to another Account"
expect = "It leaves Careful, and the pool says who left"
