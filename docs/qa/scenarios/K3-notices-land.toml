id = "K3"
title = "Notices land"
epic = "E31"
decisions = ["D-62.7"]
layers = ["L3", "L4"]
exercises = ["each notice kind"]
needs = ["lab"]

[setup]
projects = ["web", "api"]
ended_sessions = 1000

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"
# An account almost out of room.
room_used = 95

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.pools]]
name = "web"
template = "project"
scope = "web"

# One of each notice kind a lab can raise (a session working the Mac
# hard comes from a lab launch; Codex has no sign-in).
[[setup.sessions]]
id = "asks"
app = "cc-work"
project = "web"
state = "needs-you"

[[setup.sessions]]
id = "stuck"
app = "cc-personal"
project = "api"
state = "stuck"

[[setup.sessions]]
id = "failed"
app = "cc-work"
project = "api"
state = "crashed"

[[setup.sessions]]
id = "limit"
app = "cc-personal"
project = "web"
state = "limit"

[[steps]]
do = "Open each kind of notice"
expect = "It opens the right page and tab"

[[steps]]
do = "Compare Needs you with the bell"
expect = "The counts are equal"
