id = "K3"
title = "Notices land"
epic = "E31"
decisions = ["D-62.7"]
layers = ["L3", "L4"]
exercises = ["each notice kind"]
needs = ["lab"]

[setup]
projects = ["web", "api"]
ended_sessions = 1000
# 0.4.7 (the soak's persona runs, M2 and D2): the session that asks you is
# one the lab's AI Juggler starts, so its terminal is AI Juggler's: the
# lab's stand-in for Claude Code, which asks at once to run `npm test`
# and says so through the hooks AI Juggler gave it, as Claude Code does
# (Asks you, "Bash: npm test"). After `open`, start it from New session
# on a Claude Code App (web is the project no other K3 session runs in).
# A seeded one runs in no terminal AI Juggler can show: its page was
# blank.
standin = "asks"

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"
# An account almost out of room.
room_used = 95

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.pools]]
name = "web"
template = "project"
scope = "web"

# One of each notice kind a lab can raise (a session working the Mac
# hard comes from a lab launch; Codex has no sign-in; the one that asks
# you is started after open, above).
[[setup.sessions]]
id = "stuck"
app = "cc-personal"
project = "api"
state = "stuck"
# AJ-E2312 (SK48-7): a turn that started and never ended, quiet for 10
# min, so "may be stuck" is raised by the app's own rule once the lab
# opens (a session with no conversation waits at its prompt: never stuck).
open_turn = true

[[setup.sessions]]
id = "failed"
app = "cc-work"
project = "api"
state = "crashed"

[[setup.sessions]]
id = "limit"
app = "cc-personal"
project = "web"
state = "limit"

[[steps]]
do = "Open each kind of notice"
expect = "It opens the right page and tab"

[[steps]]
do = "Compare Needs you with the bell"
expect = "The counts are equal"
