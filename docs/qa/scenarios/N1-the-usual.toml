id = "N1"
title = "The usual"
epic = "E32"
decisions = ["D-62.24", "D-31"]
layers = ["L3", "L4"]
exercises = ["New session"]
needs = ["replica", "lab"]

[setup]
projects = ["api", "web"]  # web last: the usual folder is the latest
history = "one usual: Claude Code · Work in web"

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

# The usual, as data: the last session was Claude Code · Work in web.
[[setup.sessions]]
id = "usual"
app = "cc-work"
project = "web"
state = "ended"

[[steps]]
do = "Open New session"
expect = "The usual choice is made and said in one sentence"
measure = "open ≤ 100 ms"

[[steps]]
do = "Press ⌘↩"
expect = "The session really starts in that folder on that App"
