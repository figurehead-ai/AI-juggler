id = "P7"
title = "Sealed client project"
epic = "E30"
decisions = ["D-62.14"]
layers = ["L1", "L2", "L4"]
exercises = ["sealed", "switch into a sealed App", "unseal"]
needs = ["lab"]

[setup]
projects = ["client", "web"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "codex-personal"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.sessions]]
id = "c1"
app = "cc-work"
project = "client"
state = "working"

[[setup.sessions]]
id = "c2"
app = "codex-personal"
project = "client"
state = "idle"

# Step 4's session: in Client's project, in no pool of its own, on an App
# Client doesn't hold.
[[setup.sessions]]
id = "c3"
app = "codex-personal"
project = "client"
state = "idle"

[[setup.pools]]
name = "Client"
scope = "client"

[[setup.pools]]
name = "web"
template = "project"
scope = "web"

[[setup.members]]
pool = "Client"
kind = "session"
ref = "c1"
role = "lead"

[[setup.members]]
pool = "Client"
kind = "session"
ref = "c2"
role = "member"

[[setup.members]]
pool = "web"
kind = "session"
ref = "c1"
role = "member"

# The App step 4 switches into: Client holds it.
[[setup.members]]
pool = "Client"
kind = "app"
ref = "cc-work"
role = "member"

[[steps]]
do = "Seal Client"
expect = "c1 leaves its other pools; elsewhere it shows greyed: 'in Client (sealed)'"

[[steps]]
do = "c1 sends a message or doc out of Client"
expect = "Refused, with its reason"

[[steps]]
do = "Claude's own cross-session message into c1"
expect = "Refused (as the lab proved in AJ-E3002)"

[[steps]]
do = "Switch c3 (Codex · Personal, in client, in no sealed pool) to Claude Code · Work, the App Client holds. The session must work in Client's project: a session in web stays in web, which Client's scope doesn't take, so it never joins Client and nothing warns (the rc27 walk switched a web session)"
expect = "Its pools say \"Joins «Client», which is sealed: it leaves every other pool.\", marked to confirm; the switch button stays greyed until 'Switch anyway' is ticked"

[[steps]]
do = "Unseal Client"
expect = "It says what comes back before it does"
