id = "A6"
title = "Three Claude app profiles on two subscriptions"
epic = "E32"
decisions = ["D-62.3", "D-62.5"]
layers = ["L2", "L3", "L4"]
exercises = ["closed profile"]
needs = ["replica"]

[setup]
projects = ["web", "api"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "cc-personal"
tool = "claude-code"
account = "Personal"
profile = "personal"

[[setup.apps]]
id = "app-work"
tool = "claude-desktop"
account = "Work"
profile = "Work Max"
running = true

[[setup.apps]]
id = "app-side"
tool = "claude-desktop"
account = "Personal"
profile = "Side"
running = false

# D-84: a third profile only on disk, for Find them to offer.
[[setup.apps]]
id = "app-pro"
tool = "claude-desktop"
account = "Work"
profile = "Work Pro"
added = false

[[setup.apps]]
id = "codex"
tool = "codex"
account = "Personal"
profile = "default"

[[setup.sessions]]
id = "w1"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "a1"
app = "app-work"
project = "web"
state = "idle"

[[setup.sessions]]
id = "p1"
app = "cc-personal"
project = "api"
state = "ended"

[[steps]]
do = "Open Accounts"
expect = "The two Claude app profiles added, over two subscriptions, the one not running (Side) included"

[[steps]]
do = "On Claude app · Work Max's page, Find them"
expect = "Asked once, names only: Work Pro is offered (Add / Not now), nothing is added by itself (D-84); a line on the Privacy page says it"

[[steps]]
do = "Add Work Pro, then open Accounts"
expect = "Three Claude app profiles, the closed ones included"
