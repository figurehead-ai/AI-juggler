id = "X1"
title = "A day"
epic = "E33"
decisions = ["D-62", "D-31", "D-44"]
layers = ["L5"]
exercises = ["held message", "switch with pool", "mute", "cache cleared", "force quit", "usage matches"]
needs = ["lab", "rc", "live-claude", "live-codex"]

[setup]
projects = ["web"]

[[setup.apps]]
id = "cc-work"
tool = "claude-code"
account = "Work"
profile = "work"

[[setup.apps]]
id = "codex-personal"
tool = "codex"
account = "Personal"
profile = "default"

# The Team's lead and members (rc26: the pool opened empty, "Three steps
# to a working pool"): a lead and two workers on Work, one on Personal,
# so a member can ask another (member to member is ask first) and a
# switch to Codex keeps its pool.
[[setup.sessions]]
id = "lead"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "w1"
app = "cc-work"
project = "web"
state = "working"

[[setup.sessions]]
id = "w2"
app = "cc-work"
project = "web"
state = "idle"

[[setup.sessions]]
id = "w3"
app = "codex-personal"
project = "web"
state = "idle"

[[setup.pools]]
name = "Team"
template = "feature-team"
scope = "web"

[[setup.members]]
pool = "Team"
kind = "session"
ref = "lead"
role = "lead"

[[setup.members]]
pool = "Team"
kind = "session"
ref = "w1"
role = "member"

[[setup.members]]
pool = "Team"
kind = "session"
ref = "w2"
role = "member"

[[setup.members]]
pool = "Team"
kind = "session"
ref = "w3"
role = "member"

[[steps]]
do = "Morning: Needs you leads to a held pool message"
expect = "Approve it; it delivers"

[[steps]]
do = "An account runs out; switch the session"
expect = "Its pool, tasks and messages follow; the notice names its pool"

[[steps]]
do = "Mute the pool"
expect = "Its notices stop; Settings lists the mute"

[[steps]]
do = "Clear the cache mid-walk"
expect = "The page shows at once; the counts a moment later"

[[steps]]
do = "Force-quit a session, then AI Juggler, and reopen"
expect = "Everything is where it was"

[[steps]]
do = "End of the day: compare usage"
expect = "The usage lines match the vendor's own"
