[workspace]
resolver = "2"
members = [
    "crates/juggler-account",
    "crates/juggler-adapter",
    "crates/juggler-adapters",
    "crates/juggler-app",
    "crates/juggler-core",
    "crates/juggler-handover",
    "crates/juggler-link",
    # D-17 carve-out: the ONLY crate not inheriting the workspace lint
    # baseline (one audited unsafe call — see its Cargo.toml/lib.rs).
    "crates/juggler-scap-init",
    "crates/juggler-supervisor",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/figurehead-ai/AI-juggler"

# Workspace-wide lint baseline — every member inherits these via `[lints] workspace = true`.
# CI promotes warnings to errors with `-D warnings` (see docs/plan/QUALITY.md §3).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn" }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"

# AJ-E1204: the vault's cipher is optimised even in debug builds, so the
# encrypt/decrypt budget (>= 100 MB/s) is measured as users get it.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

# The cipher's generic code is instantiated in the crate that calls it.
[profile.dev.package.juggler-account]
opt-level = 3
