[workspace]
resolver = "2"
members = [
    "crates/juggler-account",
    "crates/juggler-agentbridge",
    "crates/juggler-adapter",
    "crates/juggler-adapters",
    "crates/juggler-app",
    "crates/juggler-core",
    "crates/juggler-floor",
    "crates/juggler-floor-render",
    "crates/juggler-handover",
    "crates/juggler-link",
    "crates/juggler-platform",
    # D-17, D-26 and D-27 carve-outs, and ADR-0026's: the ONLY crates not
    # inheriting the workspace lint baseline (audited unsafe calls — see
    # each one's Cargo.toml/lib.rs).
    "crates/juggler-scap-init",
    "crates/juggler-login-item",
    "crates/juggler-vm-stats",
    "crates/juggler-stats",
    "crates/juggler-supervisor",
    "crates/juggler-window-events",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/figurehead-ai/AI-juggler"

# Workspace-wide lint baseline — every member inherits these via `[lints] workspace = true`.
# CI promotes warnings to errors with `-D warnings` (see docs/plan/QUALITY.md §3).
# AJ-E2011: one version of each dependency two or more crates share.
[workspace.dependencies]
base64 = "0.23"
block2 = "0.6"
bytemuck = "1.25.2"
cpu-time = "1"
ed25519-dalek = "3"
flate2 = "1.1"
getrandom = "0.4"
hyper-util = "0.1"
memchr = "2.8.3"
nix = "0.31.3"
objc2 = "0.6"
png = "0.18"
proptest = "1.12.0"
prost = "0.14"
rusqlite = "0.41.1"
screencapturekit = "11.0.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.0"
subtle = "2.6"
sysinfo = "0.39.6"
tar = "0.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1"
toml = "1"
tracing = "0.1.44"
ts-rs = "12.0.1"
zeroize = "1.8"
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
# AJ-E2011/E2013: one log, through tracing; no stray prints or dbg!.
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# AJ-E1204: the vault's cipher is optimised even in debug builds, so the
# encrypt/decrypt budget (>= 100 MB/s) is measured as users get it.
[profile.dev.package.chacha20]
opt-level = 3

[profile.dev.package.poly1305]
opt-level = 3

[profile.dev.package.chacha20poly1305]
opt-level = 3

[profile.dev.package.zstd-sys]
opt-level = 3

# AJ-E1009: backup hashing and compression, optimised in debug builds too
# so the export/verify budgets are measured as users get them (the CI
# runner's unoptimised build ran ≈ 82 s/GB against the 60 s budget).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3

[profile.dev.package.adler2]
opt-level = 3

# The redaction scanner (hand-rolled, no regex) runs over every backup
# entry.
[profile.dev.package.juggler-handover]
opt-level = 3

# The cipher's generic code is instantiated in the crate that calls it.
[profile.dev.package.juggler-account]
opt-level = 3

# AJ-E1102/E1104: the stats store's flush and assembly budgets hold in debug
# builds too (SQLite is otherwise compiled at -O0).
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# AJ-E1102: record() must stay under 1 µs in debug builds too.
[profile.dev.package.juggler-stats]
opt-level = 3
